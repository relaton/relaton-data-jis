abstract:
- language: ja
  script: Jpan
  content: "この規格は，組織の経営陣のメンバー及びそれを支援する者に対し，組織内における情報技術（IT）の効果的，効率的及び受容可能な利活用に関する原則についての指針を示す。\nこの規格は，次のことに適用される。\n－\t組織の現在及び将来のITの利活用のガバナンス\n－\t組織のガバナンスの一領域としてのITガバナンス"
