  content: 目に対して有害な紫外放射及び赤外放射並びに強烈な可視光（有害光線）が存在する場所において，作業者の目を保護するため，各人が着用する遮光保護具について規定。溶接用保護面の面体には適用しない。この規格の有害光線には，レーザ光を含まない。
