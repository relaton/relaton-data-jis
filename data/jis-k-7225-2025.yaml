abstract:
- language: ja
  script: Jpan
  content: "この規格は，硬質発泡プラスチックの水蒸気透過速度，水蒸気透過度，水蒸気透過係数，及び水蒸気拡散抵抗指数の求め方について規定する。この方法は，厚さ10
    mm以上の均質な硬質発泡プラスチックに適用し，また，スキン又は面材をもつものにも適用可能である。ここで規定する温度及び湿度条件は，次の3種類とする。\na)\t温度38
    ℃，相対湿度勾配0 %～88 %\nb)\t温度23 ℃，相対湿度勾配0 %～85 %\nc)\t温度23 ℃，相対湿度勾配0 %～50 %"
