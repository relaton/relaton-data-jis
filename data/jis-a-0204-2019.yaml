  content: 地質図の記号，色，模様，用語及び凡例表示について，異なる作成者，異なる利用者，異なる場所，及び異なる出力形式の間で，地質図の記号，色，模様，用語及び凡例表示に関するデータの管理方法（定義，記述，表記及び表示法を含む。）について規定。地質図，地理調査などに基づいて作成される主題図には，この規格を適用しない。
