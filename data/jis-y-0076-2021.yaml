  content: サービス規格の作成において，消費者のニーズをどのように満たしていくかについての指針。サービス規格の開発に関与する全ての人が利用することが可能であり，また，どのようなサービスにも適用可能である。正式な契約を結んでいるかどうか，購入代金が支払われたかどうかに関係なく，サービス全般に適用可能である。
