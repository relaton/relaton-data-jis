abstract:
- language: ja
  script: Jpan
  content: 測定システムを校正（検量線作成）し，”校正（検量線作成）”した測定システムを統計的に管理された状態に維持するために必要な一般的原理について概説し，次の測定値の可変性に関連する二つの仮定のいずれか一つに基づく直線で表される校正関数（検量線）の推定；校正関数（検量線）の直線性の仮定と，測定値の可変性に関する仮定のチェック；ある新規，かつ，未知の量に関して校正関数（検量線）によって得られた測定値を変換することによる，その量の値の推定を行うための基本的方法を規定。
