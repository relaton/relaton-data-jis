abstract:
- language: ja
  script: Jpan
  content: |-
    この規格は，屋内空調環境条件で光ファイバ伝送システムに用いるシングルモード光ファイバピッグテール形固定光減衰器の定格，光学特性，耐環境性，耐久性，表示，包装及び安全について規定する。
    この規格で規定する要求事項は，シングルモード光ファイバピッグテール形固定光減衰器に適用する。
