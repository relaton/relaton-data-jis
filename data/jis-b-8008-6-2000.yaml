  content: 本来路上での使用のために設計された自動車用機関を除いた，移動式，可搬式及び定置式の往復動内燃機関（オフロード機関［ｏｆｆ－ｒｏａｄ　ｅｎｇｉｎｅｓ］とする。）からの排気排出物測定結果を報告する標準データ形式として使用する。土工機械，発電セットなどの用途の機関に適用。実験室及び現地での測定に適用。
