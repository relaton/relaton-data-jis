abstract:
- language: ja
  script: Jpan
  content: 粒子を含む二相系，例えば，粉体，スプレー，エアロゾル，サスペンション，エマルション及び液体中の気泡などの，光散乱パターンの解析による粒子径分布の測定及びそのための装置の要件についての指針。ただし，特定の物質を対象とする，その物質に特有な粒子径測定法について規定する指針を提供するものではない。
