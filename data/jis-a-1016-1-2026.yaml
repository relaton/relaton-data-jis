abstract:
- language: ja
  script: Jpan
  content: |-
    この規格は，コンクリート及びコンクリート構成材料に固定化した二酸化炭素の定量方法について規定する。
    また，この規格は，コンクリート及びコンクリート構造物のライフサイクルの最終段階において，コンクリート構成材料以外の用途に用いる再生砕石などに，二酸化炭素を固定化した場合の定量方法についても規定している。ただし，天然の無機炭酸塩（例えば，石灰石）中の二酸化炭素は，定量の対象としない。
