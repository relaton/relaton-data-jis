abstract:
- language: ja
  script: Jpan
  content: この規格は，管電圧150 kVまでの医療診断に用いるX線管装置の固有ろ過及びろ過物質並びに放射線治療に用いるX線管装置の固有ろ過の測定方法について規定する。医療診断に用いるX線管装置の管電圧が50
    kV以上の場合は，X線管装置のターゲット材質がタングステン又はタングステン合金にだけ適用する。
