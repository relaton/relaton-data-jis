  content: ＪＩＳ　Ａ　８３０８に定義する土工機械に包含される電気装置及びその構成部品の運転員，機械の技能者，整備保全技能者及び周囲の人の安全対策のための一般的な安全要求事項を規定。機器内部で発生する電圧は，母機取付け状態の電圧とは考えず，適用範囲に含めない。
