abstract:
- language: ja
  script: Jpan
  content: |-
    この規格は，組織の状況の下でAI（人工知能）マネジメントシステムを確立し，実施し，維持し，継続的に改善するための要求事項について規定し，手引を提供する。
    この規格は，AIシステムを活用した製品又はサービスを提供又は利用する組織によって利用されることを意図している。この規格は，組織がその目的を追求する上で責任をもって，AIシステムを開発，提供又は利用し，適用される要求事項，利害関係者に関連する義務，及び利害関係者からの期待を満たすために役立てることを意図している。
