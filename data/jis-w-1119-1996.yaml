abstract:
- language: ja
  script: Jpan
  content: 皮膜が，長期にわたる風化作用，及び直射日光への暴露に耐えることを要求されていない場合に，アルミニウム合金に施す染色陽極酸化皮膜の生成及び試験に関する要求事項を規定。陽極酸化皮膜は，硫酸法によって生成する。陽極処理は，耐食性を改善するため，美的理由で着色表面を生成するため，又は識別用色分けを部品に施すために，航空宇宙用製品の製造に適用。
