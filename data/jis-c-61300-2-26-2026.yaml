abstract:
- language: ja
  script: Jpan
  content: この規格は，塩水噴霧に対する光ファイバ接続デバイス及び光受動部品を構成する金属の耐食性を評価する手順を規定する。また，異なる金属間の腐食防止処理が十分であるかを評価する試験手順について規定する。これらのデバイスの試験条件は，IEC
    61753-1で規定している。
