abstract:
- language: ja
  script: Jpan
  content: ＶＤＴ情報処理システムを使用する際に，その利用者のためにオフィスでの仕事に関しての指針について規定。システムを具体化する組織と，そのシステムを使用する人との両方に関係している。地方及び国の条例・法規に従って適用されることが望ましい。この規格は，実際の経験に基づき人間工学上の知識を仕事の設計に適用することによって，利用者個々の能率及び福利を向上させることを目的。
