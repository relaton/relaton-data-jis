  content: 試験室における品質保証では，特に審査（ＪＩＳ　Ｚ　９３２５参照）の場合，その測定値及び分析結果の精確さ（ａｃｃｕｒａｃｙ）の問題を詳細に考慮し，また表示されている精確さを立証するために必要な原則が省かれていないことを保証することの必要性が強調される。試験室において，又は審査員として問題に直面する人々に対するいくつかの一般的勧告を明らかにしたものである。
