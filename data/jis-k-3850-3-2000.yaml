- language: ja
  script: Jpan
  content: 環境大気中のアスベスト構造体の濃度測定のための透過電子顕微鏡を用いた方法について規定。試料作製手順は，補集粒子の灰化と分散を組み合わせたもので，その結果粒子集合体及び混成物質粒子と結合したアスベストを含むすべてのアスベストが計測される。
