abstract:
- language: ja
  script: Jpan
  content: 次の三つ［タイムアセスメント機関（ＴＡＡ）の機能を定義する。；タイムスタンピング機関（ＴＳＡ）に時刻を供給するための，及びＴＡＡの使用を通じてその時刻の正確さを保証するための全体構成を記載する。；ＴＡＡが信頼できる時刻源をＴＳＡに対して供給し，また，その保証を与えるための技術指針を提供する。］について規定。
