abstract:
- language: ja
  script: Jpan
  content: |-
    この規格は，8度斜めフィジカルコンタクト（PC：physical contact）端面をもつ，直径2.5 mm及び1.25 mmの円筒形全ジルコニア（ZrO2）フェルール［APC（angled PC）端面フェルール］を用いたシングルモード光ファイバ同士の接続において，JIS C 5965-2-2の挿入損失の要求性能を満足する許容寸法限度について規定する。
    この規格で規定された材料で造られたフェルールは，IEC 61753-1の全ての環境カテゴリでの使用に適する。
