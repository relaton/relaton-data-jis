  content: 病院及び診療所以外で使用する家庭用電解水生成器で，単相機器の場合は，定格電圧が１００　Ｖで作動し，内部電源機器の場合は，電源電圧が安全特別低電圧（ＳＥＬＶ）で作動する次の機器（－　貯槽式電解水生成器；－　連続式電解水生成器）について規定。
