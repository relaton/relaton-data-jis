abstract:
- language: ja
  script: Jpan
  content: この規格は，サービスロボットが提供するアプリケーションサービス安全マネジメントシステム（ASSMS）の要求事項を規定する。アプリケーションサービスプロバイダが，訓練を受けた人間及び訓練を受けていない人間がいる非構造的な空間でアプリケーションサービスを提供する場合（空港，ショッピングモールなどで来訪者に道案内をする，病院内で患者に荷物を運ぶ，レストランで客に料理を運ぶなど）に，利用者及びその第三者の安全のためにこのASSMSを使用することが可能である。
