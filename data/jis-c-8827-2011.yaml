  content: ａ）固体高分子形燃料電池；ｂ）定格送電出力１０ｋＷ未満；c)２２０Ｖ以下；ｄ）系統連系運転するもの；ｅ）気体燃料（都市ガス，液化石油ガスなど），液体燃料（灯油など）又は水素；ｆ）燃料ガスを通じる部分の最高使用圧力が０．１ＭＰａ未満（液体燃料を通じる部分にあっては，１．０ＭＰａ未満）；ｇ）パッケージに収納した定置用の，発電専用システム又はコージェネレーションシステム；に該当する定置用の小形固体高分子形燃料電池システムにおける系統連系形パワーコンディショナの単独運転検出機能の試験方法について規定。
