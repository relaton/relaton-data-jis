- language: ja
  script: Jpan
  content: 垂直方向に圧密して形成させた粉体層を垂直方向に加圧した状態で，水平方向に横滑りさせたときに生じるせん断応力を測定する一面せん断試験による限界状態線（ＣＳＬ）及び壁面崩壊線（ＷＹＬ）を求める方法について規定。三軸圧縮試験などにおける圧縮試験によるせん断特性の評価は適用しない。
