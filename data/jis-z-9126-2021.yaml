  content: 夜間の屋外空間及びそれらに関連する領域で行われる通常の視作業並びに種々の行為が，安全かつ安心に，容易かつ快適に行えるために必要とする照明の量及び質に関する照明基準を示し，それらの照明の要求事項について規定。
