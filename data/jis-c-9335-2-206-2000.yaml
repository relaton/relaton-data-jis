abstract:
- language: ja
  script: Jpan
  content: 家庭用及び類似の食器，ふとん又は靴等を乾燥する目的の電気乾燥機の安全性について規定。定格電圧は，単相２５０Ｖ，三相４８０Ｖ以下である。通常は家庭用であるが，公衆に対する危険要因となる機器，例えば，船舶，店舗などにおいて，一般の人が使用する機器は適用範囲内。
