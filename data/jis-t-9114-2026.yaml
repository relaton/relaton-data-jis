abstract:
- language: ja
  script: Jpan
  content: この規格は，診察，治療及び処置の際に，患者及び使用者を交差感染から守るために使用する滅菌及び未滅菌の単回使用形式の歯科用ビニル手袋について規定する。また，この規格は，手袋の表面が平滑なもの及び表面の一部又は全面が粗面の手袋にも適用可能である。
