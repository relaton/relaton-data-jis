abstract:
- language: ja
  script: Jpan
  content: |-
    この規格は，JIS C 5101-1を品目別通則とする品種別通則で，電子機器の高誘電率用途に用いる，固定磁器コンデンサ種類2について規定する。また，この種類2のリードなしのコンデンサにも適用するが，表面実装用固定積層磁器コンデンサ種類2（高誘電率系）は，JIS C 5101-22を適用する。
    電磁障害用防止用固定コンデンサは，この規格を適用しないでJIS C 5101-14を適用する。
