abstract:
- language: ja
  script: Jpan
  content: 紙，板紙及びパルプの拡散反射率係数の測定装置，及びその校正手順について規定。拡散反射率係数の測定は，ＩＳＯ白色度（拡散及び青色反射率係数），パルプの散乱係数，不透明度，白色度（ｗｈｉｔｅｎｅｓｓ），視感反射率係数，紙の色度座標，非繊維材料の固有反射率係数のような光学特性の評価のために行う。
