abstract:
- language: ja
  script: Jpan
  content: 参照用の一般的な情報セキュリティ管理策群を，実施の手引を含めて示す。組織が次のとおり使用することを目的としている。ａ）ＪＩＳ　Ｑ　２７００１に基づく情報セキュリティマネジメントシステム（ＩＳＭＳ）の下で。ｂ）国際的に認められている最適な慣行に基づいて情報セキュリティ管理策を実施するため。ｃ）組織固有の情報セキュリティマネジメントの指針を作成するため。
