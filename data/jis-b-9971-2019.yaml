  content: ＪＩＳ　Ｂ　９７００に規定する機械のうち，産業分野で用いられる機械の安全に関わる要員の力量について規定。リスクアセスメント及びリスクアセスメントの結果に基づく保護方策の実施に必要な力量を区分し，各区分に要求される知識及び技能についても規定。
