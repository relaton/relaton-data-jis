abstract:
- language: ja
  script: Jpan
  content: この規格は，金属のスポット及びプロジェクション溶接継手について，板厚が0.3mm～5.0mmで任意のナゲット径をもつ通常板幅試験片の形状・寸法，及び板厚が0.5mm～10.0mmで最大7√t（t：板厚）のナゲット径をもつ飽和板幅試験片の形状・寸法，並びにそれぞれの試験片に対する引張せん断試験方法について規定する。
