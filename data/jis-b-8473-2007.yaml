  script: Jpan
  content: 燃料油を流す管路に使用し，開閉機能をもつ，作動圧力差：０～２．５ＭＰａの範囲の間にあるもの。；最高許容圧力：０．０５～２．５ＭＰａの範囲の間にあるもの。；周囲温度：－２０～＋６０℃；燃料油の温度及び動粘度：示す範囲の仕様の電磁弁について規定。
