abstract:
- language: ja
  script: Jpan
  content: 音声及び非音声音の両方又は一方だけを含む音によって，高齢者・障害者（特に視覚に障害のある人）を含む音の案内の利用者の円滑かつ安全な歩行・移動を促進するため，誘導，注意喚起，位置及び状態に関する情報提供を行う移動支援用音案内の音の特性，機器の設計及び使用方法について規定。
