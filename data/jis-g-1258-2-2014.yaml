  content: 鋼中の表１（マンガン；ニッケル；クロム；モリブデン；銅；タングステン；バナジウム；コバルト；チタン；ニオブ；カルシウム；マグネシウム；ひ素；ジルコニウム）に規定する１４成分の含有率についてＩＣＰ発光分光分析方法によって定量する方法のうち，硫酸りん酸分解法について規定。各成分のうち１成分でも含有率が表１の定量範囲の上限値を超える鋼には適用しない。ひ素については，鉄含有率（質量分率）が９０％未満の鋼には適用しない。
