  content: 現在商用化されている希土類が添加されたアクティブ光ディスクを使用した光ファイバ増幅器（ＯＦＡ）に適用。目的は，ＩＥＣ　６１２９１－１の３．に定義される光ファイバ増幅器の，ａ）小信号利得　ｂ）逆方向小信号利得　ｃ）最大小信号利得　ｄ）最大小信号利得波長　ｅ）最大小信号利得温度変動　ｆ）小信号利得帯域　ｇ）小信号利得帯域　ｈ）小信号利得安定度　ｉ）偏波依存利得変動のパラメータについて，正確かつ信頼性のある測定を行うために必要な一定の条件を確立。
