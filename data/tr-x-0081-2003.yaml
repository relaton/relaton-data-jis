abstract:
- language: ja
  script: Jpan
  content: 信頼できる第三者機関（ＴＴＰ）の提供及び運用においては，いくつかのセキュリティに関連した事項が存在する。ＴＴＰの役割，位置付け，ＴＴＰとＴＴＰサービスを利用する事業体との関係，ＴＴＰの一般的なセキュリティ要求条件，どんなタイプのセキュリティを誰が提供するか，可能なセキュリティソリューションは何か，並びに，ＴＴＰサービスのセキュリティに関する運用及びマネジメントに関する諸々の内容を含んでいる。
