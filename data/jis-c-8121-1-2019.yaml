  content: 照明器具などに組み込むことを意図した様々なタイプのランプソケット（例えば，附属書Ａに記載する受金をもつ，一般照明用光源，映写用電球，投光照明用ランプ及び街路照明用ランプを装着するランプソケット）の一般要求事項及びこれらのランプソケットに装着したランプの安全な使用を確認するための試験方法について規定。
