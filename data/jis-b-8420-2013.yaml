  content: ａ）間接式抵抗加熱炉；ｂ）直接式抵抗加熱炉の安全に関する一般事項について規定。この規格の要求事項は，ＩＥＣ　６０５１９－３，ＩＥＣ　６０５１９－４，ＩＥＣ　６０５１９－８及びＩＥＣ　６０５１９－２１を適用する直接式抵抗加熱炉には適用しない。
