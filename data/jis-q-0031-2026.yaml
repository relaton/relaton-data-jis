- language: ja
  script: Jpan
  content: この規格は，標準物質生産者（RMPs）が標準物質（RM）に附属させる，明瞭で簡潔な文書の作成を支援することを意図し，製品情報シート及びRM認証書の作成のときに考慮する必須事項，推奨事項及びその他の事項について規定する。RMの使用者及びその他の利害関係者が，RM又は認証標準物質（CRM）の適切性を確認するときに，この情報を使用することが可能である。
