abstract:
- language: ja
  script: Jpan
  content: "この規格は，屈折補正用眼鏡レンズとして用いるアンカットレンズ及び枠入れされていない玉形加工済レンズの太陽放射減衰を含む透過率特性に関する要求事項について規定する。この規格は，次の製品には適用しない。\n－\t医療目的に処方された特定の透過率又は吸収率の特性をもつレンズ\n－\t特定の個人保護装置の透過率規格が適用される製品\n－\t日食などの太陽を直接観察するための製品"
