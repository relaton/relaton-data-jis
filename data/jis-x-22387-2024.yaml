abstract:
- language: ja
  script: Jpan
  content: |-
    この規格は，人工物メトリクスの適切性，信頼性及び有効性を認定するための手順，並びに識別及び照合のための人工物メトリック認識の原則を規定するものである。
    この規格で説明する人工物メトリック認識は，人工物の特性の一つ以上の測定値を使用して，人工物を識別又は照合するために使用することが可能であり，各測定値は個々の人工物に固有で，再現は不可能とされている。
