abstract:
- language: ja
  script: Jpan
  content: |-
    この規格は，数値制御工作機械の輪郭送り性能の決定方法について規定する。
    この規格は，二つの直進軸の同時運動によって生じる円経路の両方向真円度誤差，平均両方向半径誤差，真円度誤差及び半径誤差の試験方法及び評価方法について規定する。
