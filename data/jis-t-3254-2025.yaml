abstract:
- language: ja
  script: Jpan
  content: この規格は，動脈又は血液回路から，血液ガス分析用検体として血液を採取し，血液を空気に触れずに保管できる採血容器，すなわち，血液ガス検体採取用注射筒について規定する。採血容器は，針なし，針付又は採血容器と針とのキット包装品を含み，滅菌済みでそのまま直ちに使用でき，かつ，単回使用するものとする。
