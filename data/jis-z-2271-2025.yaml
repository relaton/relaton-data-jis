abstract:
- language: ja
  script: Jpan
  content: "この規格は，次の試験方法を規定する。\na)\t伸び計伸びの連続的な監視による連続（uninterrupted）クリープ試験\nb)\t伸びの定期的な測定による不連続（interrupted）クリープ試験\nc)\t通常，クリープ破断時間だけを測定する応力破断試験\nd)\tクリープ伸びを報告しない，所定の応力の下で所定時間を超えることが可能であることを検証する試験"
