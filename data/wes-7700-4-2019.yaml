- language: ja
  script: Jpan
  content: 石油精製，石油化学，化学などのプラントの圧力設備は高経年化に伴い減肉，割れなどの劣化・損傷を受けやすい。供用中に検出された耐圧部材の局部的な欠陥の補修方法のうち，この規格は，欠陥が発生している部位に外面側から当て板（“全周当て板”を含む。）をすみ肉溶接で取り付ける補修方法について規定する。
