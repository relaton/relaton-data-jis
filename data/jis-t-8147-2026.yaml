  content: この規格は，浮遊粉じん，薬液飛まつ（沫），飛来物などから作業者の目を保護するために用いる保護めがね，並びに交換用のレンズ及びアイピースの材料，設計及び性能について規定する。ただし，遮光用保護めがね及び屈折補正用保護めがねを除く。
