  content: 対話型グラフィクスＰＨＩＧＳ　第１部　機能記述（ＪＩＳ　Ｘ　４２２１）及び，第４部　ＰＨＩＧＳ　ＰＬＵＳ（ＪＩＳ　Ｘ　４２２４）は，グラフィクスシステムのプログラミング言語に依存しない中核を規定。プログラミング言語への統合は，ＰＨＩＧＳ及びＰＨＩＧＳＰＬＵＳはプログラミング言語固有の慣例に従属し，プログラミング言語個別に存在する言語依存部に深く関わっている。
