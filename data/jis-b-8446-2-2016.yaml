  content: ＪＩＳ　Ｂ　８４４５の６．１．２．２．１（人間装着型）に規定するタイプ２．１の生活支援ロボットに相当する，低出力かつ装着型の身体アシストロボットであって，次に示す（立ち・座り，歩行，走行などの運動補助；体重支持，上肢支持などの姿勢保持；運搬，上げ・下ろし，把持，操りなどの物体操作）一つ以上のユーザの動作をアシストすることを意図した低出力装着型身体アシストロボットの安全要求事項について規定。
