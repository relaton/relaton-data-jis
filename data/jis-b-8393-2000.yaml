  content: 空気圧機器・システムの性能を示すために，異なった大気条件で求められた特性値が用いられているが，それらを関連づけるためには大気条件にかかわる変換係数が知られている必要がある。空気圧技術上，空気圧機器・システムの性能を表示するための大気条件にかかわる標準値について規定。
