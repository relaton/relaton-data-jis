abstract:
- language: ja
  script: Jpan
  content: |-
    この規格は，ディーゼル（圧縮着火）機関用コモンレール（CR）燃料噴射システム及びその構成部品に関する，用語及び定義について規定する。
    この規格で定義している用語は，コモンレール燃料噴射システムに固有のものであり，それ以外の燃料噴射システムの一般的な用語は，この規格群のその他の部に規定する。
