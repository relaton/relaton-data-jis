  script: Jpan
  content: 人体に使用する吸入麻酔器の中で，持続気流麻酔器と，気化器，呼吸，呼吸バッグなどを含む関連部品について規定。ただし，間欠気流（デマンド形）麻酔器，乳児用，新生児用の呼吸回路，人工呼吸器専用の部品などは除外する。
