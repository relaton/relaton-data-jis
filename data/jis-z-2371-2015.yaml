abstract:
- language: ja
  script: Jpan
  content: 金属材料，及びめっきなどの無機皮膜又は塗膜などの有機被膜を施した金属材料の耐食性試験として，中性塩水噴霧試験，酢酸酸性塩水噴霧試験及びキャス試験を行う場合，必要となる塩溶液，試験装置及び手法（腐食性に関わる装置の再現性の検証方法，試験片，試験条件，試験結果の表し方など）について規定。
