abstract:
- language: ja
  script: Jpan
  content: "この規格は，電池を内蔵する定格測定電圧1000 V以下で，測定対象として次のa)～e)に用いる携帯用の絶縁抵抗計について規定する。\na)\t低電圧配電路の絶縁測定　交流1000
    V及び直流1500 V以下の配電系統で，電源が切断されている電路及び機器の絶縁測定\nb)\t機器，器具，部品などの絶縁測定\nc)\t高電圧設備の絶縁測定\nd)\t発電状態にある太陽電池アレイのP-N端子間を短絡する方法での絶縁測定\ne)\t発電状態にある太陽電池アレイのP-N端子間を短絡しない方法での絶縁測定"
