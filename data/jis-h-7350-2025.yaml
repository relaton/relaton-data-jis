abstract:
- language: ja
  script: Jpan
  content: この規格は，種々のタイプの超電導センサー及び超電導検出器の仕様に関する一般事項について規定する。センサー及び検出器は，基本的に超電導材料をベースに作られており，超電導現象又は関連する現象に依存している。測定対象（測定量）には，磁界，電磁波，種々のエネルギーの光子，電子，イオン，α粒子などが含まれる。
