  content: この規格は，主に輸送用及び定置用の固体高分子形燃料電池（PEFC）に供給する水蒸気改質法（SMR）＋圧力変動吸着法（PSA）で精製した水素燃料ガス中の微量の一酸化炭素濃度を長期間かつ小流量で連続測定するための，交流電流印加方式の自動計測器について規定する。
