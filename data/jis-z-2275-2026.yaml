abstract:
- language: ja
  script: Jpan
  content: この規格は，意図的に応力集中を導入することなく，室温（理想的には10℃～35℃）において，金属試験片に対して一定振幅のモーメント，試験力又は変位を制御した試験機によって，平面曲げ疲労試験を実施するための条件について規定する。平面曲げ疲労試験の目的は，硬さ及び微視組織が与えられた材料の，様々な応力比における，負荷応力と破損までの繰返し数との関係などの情報を提供することである。
