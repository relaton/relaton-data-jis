abstract:
- language: ja
  script: Jpan
  content: この規格は，繰返し数が主として 10^7サイクル以上の疲労寿命を対象として室温大気中で行う金属材料の2つの超音波疲労試験方法（縦振動を用いた場合の軸荷重疲労試験方法及びねじり振動を用いた場合のねじり疲労試験方法）について規定する。注記　ここで，超音波疲労試験方法とは，試験片に超音波振動を与えて共振状態とすることにより，試験片に繰返し荷重を与えて，疲労寿命を測定する方法である。
