  content: 製造用ソフトウェアにおける複数のケイパビリティクラス構造を用いたプロファイル照合の手法について規定。製造用領域で使用するソフトウェア製品に適用。製造用の工程設計，操作及び制御に関わるソフトウェアのインタフェースを適用範囲とし，製品設計，工場管理，サプライチェーンマネジメント（ＳＣＭ）及び企業資源計画（ＥＲＰ）には適用しない。
