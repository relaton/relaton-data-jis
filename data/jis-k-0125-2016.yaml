  content: 工業用水及び工場排水中の揮発性有機化合物のうち，ジクロロメタン，ジブロモクロロメタン，テトラクロロメタン（四塩化炭素），トリクロロメタン（クロロホルム），トリブロモメタン（ブロモホルム），ブロモジクロロメタン，１，２－ジクロロエタン，１，１，１－トリクロロエタン，１，１，２－トリクロロエタン，１，１－ジクロロエテン（１，１－ジクロロエチレン），ｃｉｓ－１，２－ジクロロエテン（ｃｉｓ－１，２－ジクロロエチレン），ｔｒａｎｓ－１，２－ジクロロエテン（ｔｒａｎｓ－１，２－ジクロロエチレン），テトラクロロエテン（テトラクロロエチレン），トリクロロエテン（トリクロロエチレン），１，２－ジクロロプロパン，１，３－ジクロロ－１－プロペン，１，４－ジクロロベンゼン（ｐ－ジクロロベンゼン），ジメチルベンゼン（キシレン），ベンゼン，メチルベンゼン（トルエン），クロロエチレン（塩化ビニルモノマー），１，４－ジオキサン及びホルムアルデヒドの試験方法について規定。
