abstract:
- language: ja
  script: Jpan
  content: この規格は，人が作り出すシステムのライフサイクルを記述するためのプロセス記述の共通的な枠組みについて規定するものであり，エンジニアリングの視点から一そろいのプロセス及び関連する用語を定義している。これらのプロセスは，対象システム，それらのシステム要素，及びシステム
    オブ システムズに適用することが可能である。これらのプロセスから選定した集合を，システムのライフサイクルのステージ（段階）全体を通じて適用することが可能である。これは，顧客満足を達成するというゴールを最終的な目標としてもつ，対象となる全ての利害関係者の参加を通して達成される。
