abstract:
- language: ja
  script: Jpan
  content: この規格は，主として建築物の化粧材，内外壁下地，床下地，屋根下地，型枠などに用いる建築用ボードで，主な使用原料として火山性ガラス質堆積物（シラス，白土，軽石など）の粒体及びそれらの発泡体を，無機粉体（フライアッシュ，炭酸カルシウム，水酸化アルミニウムなど）及びJIS
    A 9504に規定する人造鉱物繊維保温材と複合し，有機系結合材によって層状に成形した製品について規定する。
