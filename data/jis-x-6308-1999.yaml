- language: ja
  script: Jpan
  content: 外部端子付きＩＣカードのアプリケーション識別子の付番システム及びアプリケーション提供者識別子の登録手続について規定。付番システムは，与えられたカードがアプリケーション，又はそれに関連したサービスが必要とする要素を含む場合，カード提供者によって行われたそれらの識別のための手段を提供。
