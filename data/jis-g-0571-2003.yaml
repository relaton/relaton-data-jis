abstract:
- language: ja
  script: Jpan
  content: オーステナイト系ステンレス鋼をしゅう酸溶液中で電解エッチング後，顕微鏡でエッチング面の組織を観察して，硫酸・硫酸第二鉄腐食試験（ＪＩＳ　Ｇ　０５７２），６５％硝酸腐食試験（ＪＩＳ　Ｇ　０５７３）又は硫酸・硫酸銅腐食試験（ＪＩＳ　Ｇ　０５７５）の熱酸腐食試験を行う必要があるかどうかを判別する方法について規定。
