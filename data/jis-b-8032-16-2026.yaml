  script: Jpan
  content: |-
    この規格は，往復動内燃機関に使用する呼び径200mm以下のピストンリングのコイルスプリング付き鋳鉄製薄幅オイルコントロールリングのタイプDSF-C，SSF，GSF，DSF，SSF-L，DSF-NG及びDSF-CNPの基本的寸法及び特性について規定する。
    なお，この規格は，類似した状態で作動する圧縮機用リングなどに適用してもよい。
