- language: ja
  script: Jpan
  content: "（１）アンモニア現像タイプのジアゾ写真画像を有するセルロースエステル又はポリエステルを支持体とする安全写真フィルム　（２）画像層を透明支持体上に設けるか，又は画像形成用薬品を透明支持体の中に含浸させて作られる写真フィルム　（３）マイクロフィルム，ロールフィルム及びシートフィルム　の各項のすべてに当てはまる写真フィルムに適用。　"
