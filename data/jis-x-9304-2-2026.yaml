abstract:
- language: ja
  script: Jpan
  content: この規格は，4方向デバイスを用いた選択用メニューのナビゲーション方法の設計に関する指針を示す。この指針は，4方向デバイスに関連する表示領域をもつ任意の情報機器に適用可能である。この規格は，表示画面の設定，文字集合及び使用言語に関するパラメータの推奨事項を規定する。この規格は，メニューナビゲーションの安全性に関連する用途には適用しない。
