abstract:
- language: ja
  script: Jpan
  content: |-
    この規格は，JIS A 9521に適合する建築用断熱材の長期断熱性能に関する評価方法のうち，発泡プラスチック系断熱材に関する断熱性能の収束値による評価方法について規定する。
    ただし，この評価方法は，主に長期断熱性能の維持に優れた断熱材の開発段階に適用するものであって，建築物に組み込まれた断熱材の長期断熱性能変化の直接的な評価を目的とするものではない。
