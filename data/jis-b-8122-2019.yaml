  content: ディーゼルエンジン，ガスエンジン及びガスタービンを原動機として，電力と熱とを併給するコージェネレーションシステムの性能試験方法について規定。ほかの日本工業規格及び／又は国際規格によって既に試験されている原動機，発電機，排熱回収装置など，機器単体については，この規格を適用しない。
