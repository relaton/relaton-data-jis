- language: ja
  script: Jpan
  content: 主に医療施設で使用する手動及び電動によって，背部の角度，膝部の角度，高さ及び／又はボトム全体の傾斜が無段階に調節できる（調節機能）ベッドについて規定。医療機器として使用されるベッド，小児用ベッド，特殊機能ベッド及び在宅用電動介護用ベッドは除く。
