abstract:
- language: ja
  script: Jpan
  content: |-
    この規格は，定格電圧が交流1000 V以下の回路に接続することを意図した，直列機械式開閉機器を含む場合がある半導体モータ制御器，半導体モータスタータ及びソフトスタータについて規定する。
    この規格は，バイパス手段の有無を問わず，半導体モータ制御器及び半導体モータスタータを規定する。
