  content: 家庭用の冷蔵庫で冷却し，内包された内容物の蓄熱効果によって保冷又は冷却するもののうち，繰り返し使用できる携帯用保冷具について規定。ただし，飲食物（加熱等の加工を施すものを除く。）に直接接触して使用するもの，機器に附属しているもの及び化学反応による冷却効果を伴うものを除く。
