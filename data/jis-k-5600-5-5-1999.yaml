- language: ja
  script: Jpan
  content: 関連製品の単一塗膜又は多層塗膜系を半球状の先端をもつ針で引っかくことによる貫通に対する抵抗を，特定の条件下で測定する試験方法について規定。針の貫通は多層塗膜系を除けば素材までであり，多層塗膜系の場合には，針の貫通は素材又は中間層のいずれかである。
