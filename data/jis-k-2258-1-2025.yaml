abstract:
- language: ja
  script: Jpan
  content: この規格は，揮発性で，かつ，非粘ちょう性の原油及び石油製品の37.8 ℃における180 kPa以下の蒸気圧をリード法によって求める方法について規定する。ただし，酸素化合物を含む石油製品については，炭素数が5以上のエーテル類は体積分率15
    %以下のもの，エタノールは体積分率10 %以下のもの，炭素数が3以上のアルコール類は体積分率7 %以下のものだけに適用する。
