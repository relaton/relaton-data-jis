  content: 光学素子の表面性状を指示する表示方法；主として研磨された光学面の仕様の表示方法；測定表面から表面形状を差引くトレンド除去後の残差表面の特徴付けの方法及びその表示方法について規定。表面形状を管理する規格はＪＩＳ　Ｂ　００９０－５及びＪＩＳ　Ｂ　００９０－１２であり，この規格では規定しない。
