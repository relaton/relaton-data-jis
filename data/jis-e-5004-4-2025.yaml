  content: この規格は，JIS E 5004-2による電気機器の一般規則に追加する内容として，各種の交流遮断器の特性及び試験方法について規定する。これらの遮断器の主接触部は，当該回路が特別高電圧の架空線式交流電車線電圧と同じ回路に接続されている。
