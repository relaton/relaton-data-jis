abstract:
- language: ja
  script: Jpan
  content: |-
    この規格は，溶接構造物の製作時又は使用中に各種試験により発見された欠陥に対し，機能適合性又は合目的評価の観点から，欠陥を含む当該構造要素の使用条件を十分考慮に入れて，構造要素に要求される機能に応じた評価方法の指針を示している。
    ここでは，既往の破壊力学的諸研究成果を踏まえ，かつ実用性の見地から種々の単純化を行い，一般の溶接構造物における欠陥の機能適合性に照らした許容判定を行っている。
