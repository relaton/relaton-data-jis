abstract:
- language: ja
  script: Jpan
  content: この規格は，圧縮点火機関の排気煙濃度をフィルタ式スモークメータで測定する手法を規定する。この手法は，定常状態においてフィルタの黒色化の計測（フィルタスモーク試験）及びフィルタ排気煙濃度値からのブラックカーボン質量濃度の導出によってすすの含有量を評価する。必要な場合には，特別な機関に適用するために個別の要求を指定してもよい。
