  script: Jpan
  content: 原位置の土の密度を砂置換法によって求める試験方法について規定。なお，この規格で規定する試験器具及び方法を用いて試験を行うことができる範囲は，原位置にて掘り取った土で確認された粒径の最大値が５３　ｍｍ以下の土に限る。
