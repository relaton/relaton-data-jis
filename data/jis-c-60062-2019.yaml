  content: 抵抗器及びコンデンサの指定及び表示に用いる次に示す記号化［抵抗器の場合の色による表示を含む抵抗値又は静電容量値及びそれらの許容差。；コンデンサの誘電体の種類及び抵抗器の抵抗温度係数（ＴＣＲ）などの固有の特徴。；小形部品に適した製造日付の表示。］について規定。
