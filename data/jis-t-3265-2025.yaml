abstract:
- language: ja
  script: Jpan
  content: この規格は，輸液，輸血，採血，採液，造影剤投与などの流路を延長するために用いる延長チューブについて規定する。延長チューブは滅菌済みで，そのまま直ちに使用でき，かつ，単回使用するものとする。ただし，高圧（200
    kPaを超える圧力）で用いるものは除く。
