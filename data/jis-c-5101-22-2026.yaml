abstract:
- language: ja
  script: Jpan
  content: |-
    この規格は，JIS C 5101-1を品目別通則とする品種別通則で，電子機器用の外装なし固定積層磁器コンデンサ種類2の表面実装用積層コンデンサに適用する。この規格に規定するコンデンサは，金属化電極又ははんだ付け用板端子をもち，プリント基板又はハイブリッド回路用基板に直接搭載することを意図している。
    電磁障害防止固定コンデンサは，この規格を適用せず，JIS C 5101-14を適用する。
