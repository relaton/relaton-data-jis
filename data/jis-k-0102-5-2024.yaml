- language: ja
  script: Jpan
  content: この規格は，工業用水の試験方法，及び工場（事業所を含む。）からの排水の試験方法のうち，微生物及び生物学的影響の試験方法について規定する。個別試験項目において適用対象を規定していない場合は，その試験は工業用水及び工場排水の両方に適用する。
