  content: 電子機器用コネクタにおいて，規定の炎及び振動の環境の下で最初の６分間，規定する電気的性能を満たし，かつ，試験中，コネクタを取り付けた耐火隔壁のなかへ炎が侵入するのを防いだ状態で，コネクタが２０分間絶える能力を評価するための試験方法について規定。類似の部品に用いてもよい。
