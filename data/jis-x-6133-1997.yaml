- language: ja
  script: Jpan
  content: ８ビット法による符号化情報の表現に必要なビット数を削減するロスレス圧縮アルゴリズムについて規定。このアルゴリズムは，ＤＣＬＺ（ＬｅｍｐｅｌとＺｉｖによるデータ圧縮）と呼称する。圧縮時に用いる辞書をリセットし，凍結する方法については規定しない。このアルゴリズムは，情報交換媒体に記録するときに特に有効であるが，用途はこれに限定しない。
