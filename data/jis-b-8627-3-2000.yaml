- language: ja
  script: Jpan
  content: 都市ガス又は液化ガスを燃料とするガスエンジンで蒸気圧縮冷凍サイクルの圧縮機を駆動するヒートポンプ式の冷暖房機のうち，分離形で凝縮機（蒸発器）が空冷（空冷熱源）式のダクト接続形ガスヒートポンプで，定格冷房能力が２８ｋＷ以下のものについて，各種の定格性能を決定するための標準条件及び試験方法について規定。
