  content: タンク（一重壁，ニ重壁，燃料タンク），容器（加圧容器，真空容器），アンモニア収納容器（大容量冷凍システム，肥料貯蔵庫），部品（ラミネート仕様，裏打ち仕様，ニ重壁仕様），異種材料によるシール部（ガラス，金属），及びその他（複雑な配管系，フレキシブル・コンテナ）の試験体から漏れ出るアンモニアガスを検知剤で検知する，漏れ試験方法について規定。
