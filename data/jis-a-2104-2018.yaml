  content: フレーム，サッシ，グレージング及び日射遮蔽物の効果を含む住宅用窓のエネルギー性能の計算手順について規定。また，この規格は，窓からの熱損失及び熱取得の計算手順，室内外の気象条件，並びに関連する建物特性について規定。
