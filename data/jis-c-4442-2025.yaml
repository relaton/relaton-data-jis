abstract:
- language: ja
  script: Jpan
  content: "この規格は，蓄電池のような電気化学的技術を使用した貯蔵装置をもつ，電力システムに接続される電気エネルギー貯蔵システム（BESS：Battery
    Energy Storage System）が計画外変更を受ける場合に適用する。計画外変更は，次の一つ以上を含む可能性がある。\n－\tエネルギー貯蔵容量の変更\n－\t蓄電サブシステムの電池種（電池の種類），設計及び製造業者の変更\n－\t非正規部品を使用したサブシステム構成要素の変更\n－\t運転モードの変更\n－\t設置場所の変更\n－\t再利用又は転用電池の設置による蓄電サブシステムの変更"
