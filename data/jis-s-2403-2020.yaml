  content: 加飾されたボーンチャイナ製食器の食器洗浄機による洗浄に対する退色状況を判定する化学的耐久性試験方法について規定。なお，加飾の方法は，上絵に限らない。ただし，金銀彩を用いて加飾されたボーンチャイナ製食器は，適用対象としない。
