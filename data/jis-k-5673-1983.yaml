- language: ja
  script: Jpan
  content: 工場・鉱山・学校・病院・劇場などの事業場，道路，船舶，航空保安施設などにおける災害を防止する目的で使用する安全色彩用螢光塗料について規定。螢光塗料は，有機螢光顔料とアクリル樹脂ワニスなどを原料として作った液状のもの。
