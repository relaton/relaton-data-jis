  content: 紙，板紙及びパルプ試料中の繊維組成の判別及びその定量に関する試験方法について規定。試験方法は，繊維の構造又は染色性に影響を与えないようにして離解又は脱色することが困難な，含浸加工した試料又は着色処理した試料には適さない。
