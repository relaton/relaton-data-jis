abstract:
- language: ja
  script: Jpan
  content: この規格は，光ファイバ接続デバイス及び光受動部品の光ファイバクランプ強度試験のうち，繰返し曲げについて規定する。この試験の目的は，一般的な使用環境下で耐用年数中に発生し得る繰返し曲げの影響を模擬することである。この試験は，単心の光ファイバ素線，光ファイバ心線及び光ファイバコード並びに2心以上の光ファイバに適用する。
