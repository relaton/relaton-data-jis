  content: この規格は，ゴム及びプラスチックホース並びにホースアセンブリの耐圧性試験方法について規定する。この規格で取り扱う耐圧性試験は，耐圧試験，加圧寸法変化試験，破裂試験，漏れ試験及び気密試験を指す。
