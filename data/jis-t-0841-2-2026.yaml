abstract:
- language: ja
  script: Jpan
  content: |-
    この規格は，最終段階で滅菌される医療機器を包装するためのプロセス開発及びバリデーションについて規定する。この規格のプロセスには，成形前無菌バリアシステム，無菌バリアシステム及び包装システムの成形，シール及び組立を含む。
    この規格は，無菌的に製造する医療機器の包装についての全ての要求事項を対象とはしていない。医薬品と医療機器との組合せには，追加要求事項が必要なこともある。
