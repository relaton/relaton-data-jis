  content: ＪＩＳ　Ｂ　０１４６－１に規定するクレーン及び移動式クレーンの鋼構造部分の荷重及び荷重の組合せに関する許容応力設計法による設計原則について規定。ただし，正当な理論又は実験によって証明できれば，この規格に規定する数式及び数値によらなくてもよい。
