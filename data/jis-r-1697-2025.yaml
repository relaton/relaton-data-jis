abstract:
- language: ja
  script: Jpan
  content: この規格は，白色発光ダイオードに用いられる近紫外から青色の光によって励起され可視光を発するセラミックス蛍光体粉体を対象とする，積分球を用いた光学特性評価方法について規定する。この規格は，内部量子効率の絶対測定法と，外部量子効率及び吸収率の相対測定法とから構成される。相対測定法においては，その外部量子効率及び吸収率が，ISO
    23946に準拠して求められた参照標準物質を用いる。
