abstract:
- language: ja
  script: Jpan
  content: |-
    この規格は，微小球反発硬さ試験機を用いて，主として金属材料の微小球反発硬さを試験する方法について規定する。
    なお，この規格で規定する微小球反発硬さ（反発係数）の範囲は，0.19～1.00とする。
