abstract:
- language: ja
  script: Jpan
  content: 限定された最大粒子径の中で固体粒子の量として表示される，圧縮空気中の質量濃度による固体粒子含有量を決定する試験方法について規定。また，空気汚染物質の試験方法との整合を目的とした一連の規格の一つとしてサンプリング方法，質量濃度による固体粒子に関する評価，不確かさの考察及び清浄空気要因の試験報告について規定。
