  content: 圧縮式冷凍機と貯蔵室とで構成する箱体を一体とした，定格内容積８００Ｌ以下の家庭用電気冷蔵庫及び定格内容積６００Ｌ以下の家庭用電気冷凍庫について規定。“家庭用”とは，一般消費者が日常生活用に用いるものをいい，製造業者が意図して“業務用”などとカタログ類で明示しているものは適用しない。
