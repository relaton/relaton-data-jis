abstract:
- language: ja
  script: Jpan
  content: この規格は，支持部の影響を受けない条件下で，鋼製剛飛来物が鋼板に衝突する際に，貫通が生じない飛来物の最大速度（貫通限界速度）及び貫通を生じないために必要となる最小板厚（貫通限界板厚）の推定について規定する。ただし，個々の規格，又はガイドラインなどで貫通限界速度，又は貫通限界板厚の推定が規定されている場合には，この規格を適用しない。
