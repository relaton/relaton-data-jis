abstract:
- language: ja
  script: Jpan
  content: この規格は，コンクリート用化学混和剤として用いるAE剤，高性能減水剤，硬化促進剤，減水剤，AE減水剤，高性能AE減水剤及び流動化剤について規定する。この規格は，化学混和剤を使用し，実際にコンクリートを製造する際の要求事項，すなわち，コンクリートの配合，練混ぜ，打込み，養生などに関するものを規定するものではない。
