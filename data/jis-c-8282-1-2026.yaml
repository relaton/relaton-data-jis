abstract:
- language: ja
  script: Jpan
  content: |-
    この規格は，家庭用及びこれに類する用途の交流専用プラグ及び固定形コンセント又は可搬形コンセントで，定格電圧が50 Vを超え440 V以下，定格電流が32 A以下の接地極付き又は接地極なしで，屋内用又は屋外用のものについて規定する。
    この規格の固定形コンセントは，JIS C 60364規格群の規定による施設で使用するものに適用する。
