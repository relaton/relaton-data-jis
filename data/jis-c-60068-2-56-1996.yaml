abstract:
- language: ja
  script: Jpan
  content: 電気機器・電子機器を高湿度の状態で使用又は貯蔵することができる能力を調べることを目的としている。この試験は，規定の時間，一定温度で供試品に結露を生じない状態での高湿度の影響を調べることを意図したものであり，発熱供試品及び非発熱供試品いずれにも適用。
