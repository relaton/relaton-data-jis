  content: リフトアームを装着したローダ，バックホウローダ及びスキッドステアローダにおける機械的リフトアーム支持具に対する要求性能及び試験方法について規定。リフトアーム支持具は，機械の保全，サービス又は非運転の目的でアームを高い位置に保持するためのものである。
