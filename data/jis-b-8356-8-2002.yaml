- language: ja
  script: Jpan
  content: 連続的に試験粒子を投入する油圧フィルタのマルチパスろ過性能試験；集じん量，粒子除去特性及び圧力降下を評価する方法；粒径２５μｍ以下の粒子に関し，平均ろ過比（β値）が７５以上の性能をもち，更にフィルタ性能試験回路の油タンク内の最終質量汚染濃度が２００ｍｇ／ｌ未満である，油圧用フィルタエレメントに適用できる試験；ＩＳＯミディアムテストダスト及び附属書Ａによる，試験流体を使用する試験について規定。
