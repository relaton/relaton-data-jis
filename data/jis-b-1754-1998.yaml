  script: Jpan
  content: 個々の箱に入れられた密閉型の増速及び減速歯車装置の機械振動を測定する方法について規定。歯車箱と軸の振動を測定する方法，計測器の種類，測定手順及び振動レベルを決定するための試験方法を規定。受入のための振動等級値も含まれている。
