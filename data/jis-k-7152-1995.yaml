  content: 熱可塑性プラスチック材料の試験片を射出成形する際に従うべき一般原理について規定し，二つの好ましい金型デザイン及び他の使用可能な金型デザインの例を示すもので，この規格は再現性のある成形条件を確立するための原理を規定。この規格の目的は，成形操作での種々の基本的パラメーターの記述の統一を進め，更に，統一された成形条件の報告の仕方を確立することである。
