abstract:
- language: ja
  script: Jpan
  content: |-
    日本溶接協会規格は，協会が制定した団体規格で，Welding Engineering Standard の頭文字をとってWESと略称される。
    この規格は，日本溶接協会規格(WES)として必要な事項及び様式を規定する。
    JIS Z 8301:2019（規格票の様式及び作成方法）に準拠すると共に，WES の規格票作成における関係委員会の任務及び責任，WES の制定，改正（追補を含む。）及び廃止のプロセス並びに発行済みのWESの修正プロセスを明確にした。さらに，英語による規格票の作成にも適用可能とした。
