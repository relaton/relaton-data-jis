abstract:
- language: ja
  script: Jpan
  content: |-
    この規格は，ジルコニウムの溶接継手をエックス線又はガンマ線による直接撮影方法によって試験を行う放射線透過試験方法について規定する。
    本規格では，撮影方法はJIS Z 3104:1995 に従い，透過写真の必要条件についてはジルコニウム溶接継手の吸収係数を考慮し，放射線の吸収が試験部と異なる透過度計を用いて識別線径の換算を行っていたJIS Z3107:1973 を準用して規定した。
