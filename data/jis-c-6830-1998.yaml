  content: 光伝送機器の接続，内部配線などに使用する，単心又は２心の光ファイバ心線上に抗張力体を配し，塩化ビニル樹脂を主体としたコンパウンドなどのプラスチックをシースとした光ファイバコードについて規定。全プラスチックマルチモード光ファイバ素線を用いた光ファイバコード及びテープ形光ファイバ心線を用いた光ファイアコードには適用しない。
