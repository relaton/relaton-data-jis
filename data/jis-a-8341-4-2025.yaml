abstract:
- language: ja
  script: Jpan
  content: この規格は，JIS A 8308で定義されている土工機械及びそのエクイップメントにおける機械制御システム（MCS）の安全関連部のソフトウェア開発及び信号伝送の要求事項に関する一般原則を規定する。加えて，この規格は，機械制御システム内に組み込まれたソフトウェアに関連するJIS
    B 9700に定義された重要危険源を扱っている。対処されている重要危険源は，機械制御システムへの入力に対する誤った機械制御システムの出力応答である。
