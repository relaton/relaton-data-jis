abstract:
- language: ja
  script: Jpan
  content: |-
    この規格は，不特定多数の人々向けの安全などの案内に用いる図記号の作成及びデザインに関する要求事項について規定する。ただし，機器・装置用図記号は除く。
    この規格は，安全などの案内用図記号の作成及びデザインに使用する基本形状，色及び使い方を規定する。
    この規格は，JISの案内用図記号の作成及びデザインの作成に関わる全ての人に使用される。
    この規格は，消防法，火災予防条例等による火災安全標識を含む安全標識，及び公道で使用する交通標識には適用されない。
