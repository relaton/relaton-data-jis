abstract:
- language: ja
  script: Jpan
  content: |-
    この規格は，振動試験機によって行う鉄道信号保安部品の振動試験方法架・操作卓，レールなどに取り付ける機器及び部品を対象とする。ただし，車両に搭載する信号保安部品には，適用しない。
    この規格は，鉄道車両の走行によって発生する振動に対する鉄道信号保安部品の機能及び耐久性を調べる際に適用する。
