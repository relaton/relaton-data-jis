abstract:
- language: ja
  script: Jpan
  content: "アンカットフィニッシュト眼鏡レンズ及び枠入れされた一対のレンズの太陽放射減衰を含む透過率特性に関する要求事項について規定。次の製品［\t医療目的に処方された特定の透過率又は吸収率の特性をもつ眼鏡レンズ；\t特定の個人保護装置の透過率規格が適用される製品；日食などの太陽を直接観察するための製品］には適用しない。"
