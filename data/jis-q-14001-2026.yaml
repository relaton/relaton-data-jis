abstract:
- language: ja
  script: Jpan
  content: この規格は，組織が環境パフォーマンスを向上させるために用いることができる環境マネジメントシステムの要求事項について規定する。この規格は，持続可能性の“環境の柱”に寄与するような体系的な方法で組織の環境責任をマネジメントしようとする組織によって用いられることを意図している。
