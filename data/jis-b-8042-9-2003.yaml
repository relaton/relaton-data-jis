- language: ja
  script: Jpan
  content: ガスタービン及び関連補機又はコンバインドサイクルプラントを購入者が製造業者から調達しようとするときに必要な，技術的な情報に関する基準となる指針について規定。製造業者，購入者，コンサルタント，規格団体，保険会社などの間で取り交わす信頼性，稼動性，保全性及び安全性に関する情報の基準について規定。
