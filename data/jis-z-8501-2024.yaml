abstract:
- language: ja
  script: Jpan
  content: 作業システム設計の基本指針となる人間工学の基本的な原則を規定し，関係する基本用語を定義する。設計のプロセスにおいて，人的，社会的及び技術的要求事項に均等な注意を払いながら，人間工学の専門家が設計に携わる人々と協力して行う総合的な手法を規定。
