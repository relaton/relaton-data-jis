abstract:
- language: ja
  script: Jpan
  content: 乾電池のような小さくて簡単な製品から，大規模電気工業設備のような大形又は高度に複雑な製品に至るまで，電気及び関連分野におけるあらゆる種類の製品にとって必要又は有用であるすべての種類の取扱説明に関する立案と定式化とについて，一般原則及び詳細な要求事項を規定。
