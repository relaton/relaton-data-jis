  content: 次の場合［ａ）組織が，顧客要求事項及び適用される法令・規制要求事項を満たした製品及びサービスを一貫して提供する能力をもつことを実証する必要がある場合；ｂ）組織が，品質マネジメントシステムの改善のプロセスを含むシステムの効果的な適用，並びに顧客要求事項及び適用される法令・規制要求事項への適合の保証を通して，顧客満足の向上を目指す場合］の品質マネジメントシステムに関する要求事項について規定。
