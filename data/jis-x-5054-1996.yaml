abstract:
- language: ja
  script: Jpan
  content: 公開鍵システムを用いて，限定された長さのメッセージの復元を可能にするディジタル署名方式を規定。ディジタル署名方式は，－秘密署名鍵及びメッセージに署名する署名関数を用いる署名処理。－メッセージの回復中に署名を検査するための公開検証鍵及び検証関数を用いる検証処理。
