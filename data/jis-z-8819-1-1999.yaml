  content: 粒子径測定結果を表すためのヒストグラム，頻度分布及び積算分布の図示方法を規定。用語の標準化を図るとともに，測定データから前述の各種の分布を得るための計算手順についても規定。固体，液体及び気泡粒子のすべての粒子径範囲の測定結果の図示に対して適用。
