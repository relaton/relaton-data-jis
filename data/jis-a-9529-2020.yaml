abstract:
- language: ja
  script: Jpan
  content: シリカ粒子など又はグラスウールを芯材とする，建築物に使用する真空断熱材（ＶＩＰ）について規定。ただし，冷凍倉庫などの特殊な温湿度環境下で使用する真空断熱材，並びに住宅及び建築物の設備機器，配管などに使用する真空断熱材は除く。
