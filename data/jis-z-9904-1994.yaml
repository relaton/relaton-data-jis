abstract:
- language: ja
  script: Jpan
  content: 品質管理及び品質要素についての指針を与える。これらの品質システム要素は，顧客の満足を目指して総合的，かつ，効果的な組織内の品質システムを構築し，実施する際に用いるのに適している。契約，規制又は認証に使用することを目的としてはいない。したがって，この規格は，ＪＩＳ　Ｚ　９９０１，９９０２及び９９０３を実施する際の指針ではない。このための指針としては，ＩＳＯ　９０００－２を用いることが望ましい。
