abstract:
- language: ja
  script: Jpan
  content: |-
    この規格は，臨床検査室の品質及び能力に関する要求事項について規定する。
    この規格は，臨床検査室がマネジメントシステムを構築し，自らの能力を評価する際に使用することが可能である。また，臨床検査室の利用者，行政機関及び認定機関による臨床検査室の能力の確信又は確認に使用することも可能である。
