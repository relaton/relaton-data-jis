  content: マルテンサイト，折出硬化及びマルエージングの各種ステンレス鋼（例えば，ＳＵＳ　４００系，ＰＨ１３－Ｍｏ，Ｃｕｓｔｏｍ４５０及ひ４５５）を用いて製造した部品の表面処理に対する要求事項について規定。汚染要因物の除去及び航空宇宙用に適した耐食性を得るための実用的な方法を規定。
