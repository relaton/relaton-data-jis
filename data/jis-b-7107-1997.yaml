abstract:
- language: ja
  script: Jpan
  content: 遠方の物体を撮影するためのカメラレンズの光軸上での分光透過率を，波長３５０～７００ｎｍの範囲にわたって測定するための特有の条件を述べ，その条件下での分光透過率の測定方法について規定。分光透過率の値をＩＳＯ色特性指数の計算だけに用いるのであれば，この規格全体について，波長範囲を３６０～６８０ｎｍと読み替えるのがよい。ミラーレンズにも適用。
