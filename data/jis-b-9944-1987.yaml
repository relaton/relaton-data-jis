abstract:
- language: ja
  script: Jpan
  content: 廃水と好気性微生物体の凝集体である活性汚泥とをかくはん混合，沈澱しにくい懸濁物質及び溶解性物質を生物化学的に吸着，酸化又は同化し，最終的に沈澱しやすい汚泥に変換させて水中から除去するために用いる標準活性汚泥処理装置のばっ（曝）気槽及び沈澱槽などの使用状態における試験項目及び試験方法について規定。
