abstract:
- language: ja
  script: Jpan
  content: |-
    この規格の適用範囲は，次によるほか，JIS C 8462-1:2021の箇条1による。
    JIS C 8462-1:2021の箇条1の“ボックス及びエンクロージャは，”で始まる段落の後に，次を追加する。
    追加
    この規格は，ジャンクション及び／又はタッピングの接続ボックスに適用する。ただし，フローティング端子又はフローティング接続装置を同こん（梱）していない接続ボックスは，この規格ではなくJIS C 8462-1:2021を適用する。
