abstract:
- language: ja
  script: Jpan
  content: |-
    この規格は，板厚0.4  mm以上5.0  mm以下の低炭素鋼及び低合金鋼（いずれもめっき鋼板を含む。）におけるスポット溶接（以下，溶接という。）作業について規定する。
    ただし，ダイレクトスポット溶接を対象とし，シリーズスポット溶接などの特殊な通電方式のものは除くものとする。溶接機としては，変圧器付ガン，ポータブル型溶接機を含む。電源としては，単相交流式電源以外に，単相整流式，三相整流式及びインバータ式の直流電源及び交流電源，並びにコンデンサ式電源を含む。
