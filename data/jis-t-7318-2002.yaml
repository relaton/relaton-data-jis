- language: ja
  script: Jpan
  content: 人眼角膜全面をトーリック面と仮定し，その反射像によって，角膜主経線曲率半径及び角膜主経線方向を測定し，曲率半径の値から角膜屈折力を演算によって求めて，曲率半径，主径線の方向及び角膜屈折力を表示するオフサルモメータについて規定。
