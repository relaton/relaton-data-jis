- language: ja
  script: Jpan
  content: 血液，え（壊）死細胞などの有機物に汚染された使用後の医療機器を，再使用を目的とした洗浄及び滅菌処理の後処理を安全に実施できる状態にするために，これら（被滅菌物）を洗浄した後，飽和蒸気を用いて滅菌する洗浄滅菌器の基本要求事項について規定。
