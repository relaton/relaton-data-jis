abstract:
- language: ja
  script: Jpan
  content: "この規格は，加硫ゴム及び熱可塑性ゴムの熱老化特性を促進老化試験及び／又は熱抵抗性試験によって求める方法について規定する。試験方法には，次のA法及びB法がある。\na)\tA法　送風装置を備えた強制循環形熱老化試験機を用いる方法。\nb)\tB法　試験槽内の空気が対流によって緩やかに換気するセル形熱老化試験機又は自然換気形熱老化試験機を用いる方法。"
