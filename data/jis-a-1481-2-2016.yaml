abstract:
- language: ja
  script: Jpan
  content: 建材製品中から試料を採取し，採取した試料中のアスベスト含有の有無を判定するために，採取した試料の定性分析用試料（一次分析試料又は二次分析試料）の作製方法，Ｘ線回折装置及び位相差・分散顕微鏡を用いた定性分析方法並びにアスベスト含有の有無を判定する方法について規定。アスベストが不純物として含有するおそれのある天然鉱物及びそれを原料としてできた製品（バーミキュライトを原料とした吹付け材を除く。）については，適用できない。
