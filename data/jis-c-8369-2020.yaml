  content: "屋外の一般場所で単独に使用する，交流単相2線式の定格電圧100 V又は200 Vの一体方式及び分離方式の光電式自動点滅器について規定。ここでいう一般場所には，次の場所を含まない。a)\t腐食性ガスのある場所b)\t海岸など塩害のおそれのある場所c)\t常時高温又は高湿の場所"
