abstract:
- language: ja
  script: Jpan
  content: この規格は，意図的に応力集中部を導入せずに，金属試験片に対して室温及び高温において軸方向，一定振幅の軸力制御疲労試験を実施するための条件について規定する。この規格による試験の目的は，硬さ，微視組織などが与えられた材料の，様々な応力比における負荷応力と破損までの繰返し数との関係などの疲労情報を提供することである。
