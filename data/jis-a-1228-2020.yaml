abstract:
- language: ja
  script: Jpan
  content: 目開き4.75 mmのふるいを通過した土をモールド内に突固めによって締め固めた供試体について，コーン指数を求める貫入方法について規定。安定処理した土にも適用できる。ただし，この規格が適用できる安定処理土のコーン指数は，1
    MN/m2～1.5 MN/m2程度以下とする。
