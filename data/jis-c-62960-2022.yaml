  content: システムのライフサイクルの全段階で適用可能な，技術的観点からの総合信頼性レビューの方法についての手引を示す。潜在的な総合信頼性の問題に対処するために，適切なタイミングで適切な対策を講じることによって，システムのライフサイクル全体の総合信頼性を向上させることが可能である。
