abstract:
- language: ja
  script: Jpan
  content: この規格は，換気システムで使用される二つの気流の間で熱，又は熱及び水蒸気を伝達する装置のうち，空気対空気の全熱及び顕熱交換器単体の性能を試験し，特性評価する方法について規定する。また，建築物のエネルギー性能の算定に用いる全熱交換器の性能を決定する方法についても規定している。
