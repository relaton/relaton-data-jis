- language: ja
  script: Jpan
  content: 主に医療施設において感染症にり（罹）患している又はり患しているおそれのある患者に対し，手術，治療又は接近する医療従事者などが使用するマスクのうち，一体となったろ過材及び面体，並びにしめひもからなる排気弁をもたない感染対策医療用の単回使用の呼吸用保護具の性能要件及び試験方法について規定。
