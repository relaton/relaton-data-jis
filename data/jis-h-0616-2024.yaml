  content: 室温フーリエ変換赤外吸収分光法によるシリコン単結晶の低濃度置換型炭素濃度の測定方法について規定。炭素原子が５×１０１４　ａｔｏｍｓ／ｃｍ３（０．０１　ｐｐｍａ）～５×１０１５　ａｔｏｍｓ／ｃｍ３（０．１　ｐｐｍａ）の濃度範囲の測定に適用可能である。この規格による測定方法は，生産管理，材料研究，品質保証，及び材料承認に適用性がある。
