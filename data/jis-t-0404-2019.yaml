abstract:
- language: ja
  script: Jpan
  content: 持続的血液ろ（濾）過器の血栓性を，インビトロ（ｉｎ　ｖｉｔｒｏ）で試験する方法について規定。使用環境を模擬した血液循環回路を使用して，第一に血液接触後のろ過器入口圧の測定による回路循環時間（ライフタイム）の評価，及び第二にろ過器への血栓の付着状態を評価するための試験方法を規定。
