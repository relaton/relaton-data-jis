  content: 陽電子放出核種からの消滅放射線を，同時計数によって検出するＰＥＴ装置（陽電子放射断層撮影装置）の性能を公表するための用語及び試験方法について規定。これまで既知の全ての試験が，ほとんど画像中に雑音を反映しているため，再構成画像の均一性を特徴付ける試験は除く。
