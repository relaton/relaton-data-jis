abstract:
- language: ja
  script: Jpan
  content: 平板状又は曲がった形状の固形材料について，厚さ方向の水分吸収特性の求め方について規定。正確に定めた寸法をもつプラスチック試験片を，液に浸せきしたり，状態調節した浸潤空気にさらす場合に，吸収した水分量を測定する手順について規定。
