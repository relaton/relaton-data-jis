abstract:
- language: ja
  script: Jpan
  content: 介助者が容易に高齢者又は障害者のが（臥）床状態の体位の変換，保持又は移動をするための体位変換用具のうち，体位変換用シート及び体位変換用クッションについて規定。体を持ち上げて移動させる体位変換用シート，起き上がり補助装置，ボード形体位変換用具，及びグローブ形体位変換用具には適用しない。
