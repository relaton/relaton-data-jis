  content: 交流１　０００Ｖ及び／又は直流１　５００Ｖ以下の電気設備又は通信設備内の電線及び／又はケーブルを保護するために用いる金属製可とう電線管の寸法，構造及び試験方法について規定。この規格では，二種金属製可とう電線管の寸法，構造及び試験方法を規定。
