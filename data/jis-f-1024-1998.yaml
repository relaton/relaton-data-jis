  content: 長さ２４ｍ以下の舟艇に使用される，ステアリングホイルから船外機，船内機及び船内外機の操だ装置の結合点までの油圧操だ装置とその構成要素の要件，試験方法，オーナ用及び据付者用マニュアルについて規定。ステアリングホイルからステアリングアームへの接続金具までを含める。
