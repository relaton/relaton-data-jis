abstract:
- language: ja
  script: Jpan
  content: この規格は，JIS C 5101-1:2023を品目別通則とする品種別通則で，電子機器用の表面実装用固定メタライズドポリエチレンナフタレートフィルム直流コンデンサについて規定する。この規格は，誘電体がポリエチレンナフタレートでその上にメタライズドされた電極をもつ表面実装用固定コンデンサに適用する。このコンデンサは，はんだ付け用基板端子又はメタライズドされた電極面をもち，ハイブリッド回路基板又はプリント基板に直接取り付けることが可能なもので，使用条件によっては，“自己回復作用”が発生する場合がある。また，定格電圧に対して交流成分が小さい場合に用いる。
