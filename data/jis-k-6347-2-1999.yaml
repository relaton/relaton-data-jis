abstract:
- language: ja
  script: Jpan
  content: 液化石油ガス（ＬＰＧ）を，鉄道タンク貨車又は道路タンク車両及びパイプラインでバルク輸送する場合に使用する可とう（撓）性ゴムホース及びホースアセンブリの要求事項について規定。規定するホースは，－４０℃～＋６０℃の液状で使用されることを目的とし，最高使用圧力が，２ＭＰａのホース及びホースアセンブリの要求事項について規定。
