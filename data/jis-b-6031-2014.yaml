abstract:
- language: ja
  script: Jpan
  content: 主に切削による部品加工用に設計した次のグループ［グループ1（数値制御機能をもたない手動旋盤）；グループ2（簡易数値制御機能をもつ手動旋盤）；グループ3（数値制御旋盤及びターニングセンタ）；グループ4（単軸及び多軸自動旋盤）］に分類する旋盤及びターニングセンタ上の危険源の除去又はリスク低減のための要求事項及び／又は方策について規定。
