- language: ja
  script: Jpan
  content: １枚の金属板材から切り出した，板厚が均一な十字形試験片（以下，試験片という。）に，その直交する２本の中心線と平行に直交２方向の引張力を負荷し，金属板材の二軸応力下での真応力－塑性ひずみ曲線を測定する方法について規定。
