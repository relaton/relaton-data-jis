abstract:
- language: ja
  script: Jpan
  content: "この規格は，3ポジションイネーブルスイッチについて規定する。\nこのスイッチは，次の信号を与えるイネーブル機器の部品として使用するものを対象としている。\na)\t操作をしてポジション2（図1参照）を保持している間は，機械の運転が別の起動制御によって可能となる。\nb)\t操作をしていないポジション1（図1参照），又はポジション3（図1参照）に操作したときは，次の制御となる。\n－\t停止指令が発信される。\n－\t機械の起動が不可能である。"
