abstract:
- language: ja
  script: Jpan
  content: |-
    この規格は，音響カプラ又は密閉形擬似耳を用いた気導補聴器の性能特性の測定に推奨される方法について規定する。
    この規格は，補聴器の電気音響特性の測定及び評価，例えば，型式試験及び製造業者のデータシートに適用可能である。
