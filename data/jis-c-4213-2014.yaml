  content: 次に示す周波数５０Ｈｚ及び／又は６０Ｈｚの単一速度低圧三相かご形誘導電動機のうち，低圧トップランナーモータについて規定。インバータ駆動専用に製作した電動機；機械（例えば，ポンプ，ファン及びコンプレッサ）に組み込んで，かつ，機械から分離して試験ができない電動機には適用しない。
