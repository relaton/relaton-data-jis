  content: ＪＩＳ　Ｘ　０２０８で規定する６８７９文字の符号化幹事集合を拡張し，ＪＩＳ　Ｘ　０２０８と同時に運用する４３５４文字を含め１１２３３の図形文字とそれらのビット組合せとの対応を規定。第４水準漢字集合を除く８７９７文字からなる符号化漢字集合と第４水準漢字集合の２４３６文字からなる符号化漢字集合との二つの符号化漢字集合を規定。
