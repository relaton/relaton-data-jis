abstract:
- language: ja
  script: Jpan
  content: 圧縮空気又は機械式手段で粒状物質を吹き付け，表面処理を行う研磨ブラスト作業用の防護服及び手の防護に関する最低限の要求事項及び試験方法について規定。なお，蒸気ブラスト作業，ジェットブラスト作業，及び火炎ブラスト作業には適用しない。
