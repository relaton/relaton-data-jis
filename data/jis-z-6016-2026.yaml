abstract:
- language: ja
  script: Jpan
  content: |-
    この規格は，文書を取得し，処理に適した形式に変換する受領プロセスについて規定する。
    受領プロセスは，文書の取得作業及び処理可能形式への変換作業及び処理プロセスへの引渡し作業から構成される。また，受領プロセスで取り扱った文書及び経緯情報の保存運用への移行，文書の品質及び信頼性の確認を含む。
