  content: 主として工場，倉庫などの事業場に設置されるクレーンなどの移動用機器に電気を供給する交流６００Ｖ又は直流７５０Ｖ以下の電路に使用する定格電流２　０００Ａ以下の絶縁トロリー線及びその附属品で構成する絶縁トロリーシステムについて規定。多線式絶縁トロリーシステムは，屋内用だけに適用。
