- language: ja
  script: Jpan
  content: 船内に，恒久的に装備するリチウム二次電池の単電池及び電池システム並びにそれらに接続する充放電システムの安全性要求事項について規定。総トン数２０ｔ未満の船舶，又は総トン数２０ｔ以上であってスポーツ若しくはレクリエーションの用だけに供する船体の長さが２４ｍ未満の船舶に装備する設備には適用しない。
