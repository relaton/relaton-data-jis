abstract:
- language: ja
  script: Jpan
  content: この規格は，X 軸が最大5000 mm並びにY軸及びZ軸が最大2000 mmの数値制御による直進軸を備えた垂直主軸をもつマシニングセンタの工作機械構造及び位置決めシステムの熱変形を評価するための試験について規定する。また，X軸が最大5000
    mm，Y軸が最大3200 mm及びZ軸が最大2000 mmの数値制御による直進軸を備えた水平主軸をもつマシニングセンタにも適用する。
