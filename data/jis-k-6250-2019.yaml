  content: ゴムの物理試験方法に関わる試験片の，保管，状態調節及び試験条件（温度，湿度，時間）並びに識別方法，作製方法及び寸法測定方法について規定。特定の試験又は試料に対する特別な試験条件，特定の環境条件を追尾・再現（シミュレート）する条件及び製品全体を試験するための特別な要求条件は含まない。
