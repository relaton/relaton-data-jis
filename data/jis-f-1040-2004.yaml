  content: 船体長さ２４m以下の舟艇に適用する窓，ハッチ，ポートライト，デッドライト及びドアについて，船の種類，装置の位置及び設計区分を考慮に入れて，技術上の要件を規定。扱う装置は，船の水密性に関して重要なもの，すなわち，板が破損した場合に浸水する恐れがあるものだけである。
