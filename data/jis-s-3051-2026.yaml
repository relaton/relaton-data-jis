abstract:
- language: ja
  script: Jpan
  content: |-
    この規格は，薪又は木質ペレットを燃料とする，主として一般家庭用の暖房に用いる木質バイオマス燃料燃焼機器の熱効率，熱出力及び消費電力を測定するための試験方法について規定する。
    ただし，壁付暖炉（築炉），燃焼室に扉を備えていない機器及びボイラーを備えた機器は適用対象としない。
