abstract:
- language: ja
  script: Jpan
  content: この規格は，プラスチックフィルムをプラズマ処理方式の表面改質処理装置によって表面改質処理を行い，特定の波長の紫外線を照射し，励起される蛍光強度を測定することによって表面改質度を非接触かつ連続的に測定し，プラズマ処理装置の改質性能を試験する方法について規定する。
