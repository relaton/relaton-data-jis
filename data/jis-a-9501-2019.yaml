  script: Jpan
  content: 化学工業，燃料工業及び熱利用動力に関する諸装置，空気調和，給排水衛生設備などの保温保冷工事において使用する保温保冷材料及び副資材の種類，使用方法，設計方法及び施工要領について規定。冷蔵庫・船舶・鉄道車両関係の保温保冷工事を除く。
