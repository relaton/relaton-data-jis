abstract:
- language: ja
  script: Jpan
  content: |-
    この規格は，鋼板用スポット溶接電極の電極材料，電極形状及び被溶接鋼板の組合せによる寿命の相対評価のための試験方法について規定する。
    めっきなし鋼板とめっき鋼板の混合打点の場合について規定したのも，本試験方法の特色の一つといえる。
    アルミニウム合金については，そのスポット溶接の場合の連続打点の状態は，鋼板の場合とは一般に大きく異なるため，適用対象外とした。
