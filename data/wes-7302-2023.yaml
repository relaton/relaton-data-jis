abstract:
- language: ja
  script: Jpan
  content: |-
    この規格は，板厚0.4 mm 以上5.0 mm 以下の3 枚以内のアルミニウム及びアルミニウム合金（以下，アルミニウム合金という。）の抵抗スポット溶接（以下，スポット溶接という。）の作業標準について規定する。ただし，シリーズスポット溶接などの特殊な通電方式及び亜鉛めっき材，陽極酸化処理材などの表面処理材は除く。
    なお，鋳物及びダイカストに関しては，受渡当事者間の協定による。
