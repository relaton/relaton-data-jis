abstract:
- language: ja
  script: Jpan
  content: |-
    この規格は，容積形圧縮機の体積流量及び動力に関する性能試験について規定する。また，液封式圧縮機の試験方法については，附属書Aに規定する。
    この規格は，定格の負荷で運転する場合の性能試験における試験方法及び試験条件について規定する。
