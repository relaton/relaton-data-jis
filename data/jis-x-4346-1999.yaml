  content: 拡張対話型マルチメディア応用を交換する際の最終形式符号化表現及び意味を規定。応用は，計算機能（データ処理），拡張された通信機能（サーバ，ローカルデバイスなどの外部環境とのやりとり）などを総合することによって，ＪＩＳ　Ｘ　４３４５によって実現される応用を拡張する。
