- language: ja
  script: Jpan
  content: ＪＩＳ　Ｂ　０１１４の番号６３２１に規定する単軸面取り盤及び番号６３２１に規定する複軸面取り盤のうち，単軸面取り盤については有効切削高さが１００ｍｍ以下の面取り盤，複軸面取り盤については有効切削高さが１００ｍｍ以下で主軸センタ間の距離が１００ｍｍ以上６８０ｍｍ以下の面取り盤の機能，運転性能及び剛性に関する試験方法並びに静的精度及び工作精度の検査方法について規定。
