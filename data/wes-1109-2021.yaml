abstract:
- language: ja
  script: Jpan
  content: 破壊じん（靱）性値は，不安定破壊が開始する限界値としての限界CTOD値として与えられ，構造要素の破壊安全性評価，又は材料選定のための材料評価に用いることができる。この規格は，鋼の溶接継手における破壊じん（靱）性値を評価するための試験方法を規定するものである。試験片の疲労予亀裂前縁形状の直線性を確保するため、局部圧縮法及び逆曲げ法を適用できるようにしている。
