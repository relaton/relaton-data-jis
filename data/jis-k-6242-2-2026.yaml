abstract:
- language: ja
  script: Jpan
  content: この規格は，加硫ゴムを加熱した際に揮発する硫黄化合物量を，ガスクロマトグラフ（GC）又はイオンクロマトグラフを用いて求める方法について規定する。なお，この規格で測定可能な硫黄化合物は，硫化水素（H2S），硫化カルボニル（COS），二硫化炭素（CS2）及び二酸化硫黄（SO2）である。
