  content: 機械的危険源から人を保護するために提供されるガードの設計，製作及び選択のための一般要求事項について規定。インターロック装置には適用しない。転倒時保護構造（ＲＯＰＳ），落下物保護構造（ＦＯＰＳ）及び横転時保護構造（ＴＯＰＳ）のような移動性に関連する又は荷揚げ能力に関連する特別のシステムのための要求事項については規定しない。
