  script: Jpan
  content: ゴム工業で原材料の配合剤として用いられるゴム用カーボンブラックの付随的特性のうち，カーボンブラックを水洗して得られるふるい残分の求め方について規定。オイル処理カーボンブラックに対しては，オイルが試料の水ぬれを阻害するため，この試験方法は適用できない。
