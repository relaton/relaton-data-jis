abstract:
- language: ja
  script: Jpan
  content: この規格は，次に示す法律で引用している技術基準などに基づいて，一般社団法人日本溶接協会
    技術基準・認証委員会（以下，協会という。）が行う，原子力施設の構造物に係る溶接士の技能認証試験基準について規定する。a)
    核原料物質，核燃料物質及び原子炉の規制に関する法律（以下，原子炉等規制法という。）
    第16 条の3第2 項（加工施設）b) 原子炉等規制法 第28条第2項（試験研究用等原子炉施設）c)
    原子炉等規制法 第43条の3の11第2項（発電用原子炉施設，研究開発段階発電用原子炉施設）d)
    原子炉等規制法 第43条の9第2項（使用済燃料貯蔵施設）e) 原子炉等規制法
    第46条第2項（再処理施設）f) 原子炉等規制法 第51条の8第2項（特定第一種廃棄物埋設施設又は特定廃棄物管理施設）g)
    原子炉等規制法 第55条の2第2項（使用施設等）
