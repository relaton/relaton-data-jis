abstract:
- language: ja
  script: Jpan
  content: |-
    この規格は，最終段階で滅菌される医療機器の無菌性を使用時点まで維持できるように意図した材料，成形前無菌バリアシステム，無菌バリアシステム及び包装システムについて規定する。
    この規格は，無菌的に製造する医療機器の無菌バリアシステム及び包装システムについての全ての要求事項を対象とはしていない。医薬品と医療機器との組合せには，追加要求事項が必要なこともある。
