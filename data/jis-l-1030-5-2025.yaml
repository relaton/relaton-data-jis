- language: ja
  script: Jpan
  content: この規格は，単一の動物種で構成された獣毛繊維の電気泳動による鑑別方法について規定する。繊維の種類を鑑別する試験方法はJIS L 1030-1に規定されているが，この規格に規定する試験方法によって，繊維製品及び毛皮製品の毛をより高い精度で鑑別することが可能となる。
