  content: |-
    この規格は，ガスシールドアーク溶接による建築鉄骨溶接ロボット型式認証における試験方法及び判定基準について規定する。
    この規格は，一般社団法人日本ロボット工業会との共通規格であり，一般社団法人日本ロボット工業会はJARAS  1012を制定し，建築鉄骨溶接ロボットの型式を認証し，型式認証書の発行と型式の管理を行っている。
