abstract:
- language: ja
  script: Jpan
  content: |-
    この規格は，Vブロック法を用いて，365nm～24000nmの波長範囲で，3×10－5以内の精度で光学ガラスの屈折率を決定する方法について規定する。
    この規格の開発において，光学ガラスだけを考慮しており，ガラス以外の材料に適用することも可能であるが，他の材料の場合には考慮されていない事項があり得る。
