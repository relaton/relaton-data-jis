abstract:
- language: ja
  script: Jpan
  content: この規格は，マルチモード光ファイバを使用する敷設済み光ファイバケーブル設備の減衰量測定について規定する。このケーブル設備は，マルチモード光ファイバ，コネクタ，アダプタ，スプライス，及び他の受動部品を含めることが可能である。ケーブル配線は，住宅，商業施設，工業施設，及びデータセンターの構内，並びに外部の設備環境を含む様々な環境に設置することが可能である。この規格で使用される試験装置は，一つの単心ファイバコネクタインタフェース又は二つの単心ファイバコネクタインタフェースをもつ。
