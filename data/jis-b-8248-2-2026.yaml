abstract:
- language: ja
  script: Jpan
  content: この規格は，JIS B 8266:2003及びJIS B 8266:2006（追補1）を基本要求事項とし，設計圧力100 MPa未満で，設計温度がクリープ領域未満の大気圧を超える圧力を保持する又は外圧を保持する円筒形多層圧力容器について規定する。また，多層容器特有の規定は，ASME
    Section VIII Division 2:2023の要求事項に基づいている。
