  content: 生地の片面（肌面）に供給する空気を低湿から高湿に変化させたときに生じる吸湿発熱現象において，最大吸湿発熱温度到達後の吸湿発熱温度保持性を概観できる指標となる熱保持指数を測定する試験方法について規定。織物，編物，不織布などの平板状繊維素材について適用する。
