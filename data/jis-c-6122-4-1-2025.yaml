abstract:
- language: ja
  script: Jpan
  content: この規格は，EDFAを代表とする光増幅器（OA）を含む光サブシステムの，二波長法による過渡パラメータ測定方法について規定する。この規格を適用するOAは，希土類のドーパントを含むアクティブ光ファイバを使ったOA［光ファイバ増幅器（OFA）］である。これらの増幅器は，商用のネットワークで広く普及している。
