abstract:
- language: ja
  script: Jpan
  content: 航空機エンジン始動用の空気源と機体との接続部の寸法を規定。この寸法は，コネクタ及びアダプタに対し国際的な互換性を確実にするために必要である。地上装置側アダプタを適切に接続できるように，航空機側で必要な最小余裕空間を規定。
