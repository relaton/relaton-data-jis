abstract:
- language: ja
  script: Jpan
  content: "この規格は，圧縮性流体，すなわち，気体を使用する空気圧機器の流量特性を決定するための代替試験方法として，充填試験及び放出試験について規定する。ただし，この規格は，次のような流量係数が変化する機器には適用しない。\na)\t流れによって変形する弾性部品を含むため，著しく大きなヒステリシス特性をもつ機器\nb)\t減圧弁などのような，内部フィードバック機構をもつ機器\nc)\tチェック弁，急速排気弁などのような，クラッキング圧力をもつ機器\nd)\tシリンダ，アキュムレータなどのような，流量測定中に流体と機器との間でエネルギーを変換する機器"
