  content: 油圧用フィルタエレメントのつぶれ又は破裂試験，すなわち汚染した試験液をフィルタエレメントに流すという方法で差圧を発生させたとき，フィルタエレメントが正常な（意図した流れの方向）流れにおいて，つぶれ若しくは破裂のどちらかが発生するか，又はフィルタエレメントが故障することなく所定の最大差圧に達するまで耐え得るかを確認するための試験方法について規定。
