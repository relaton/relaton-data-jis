abstract:
- language: ja
  script: Jpan
  content: ゴム片を混用する染色した繊維品を熱空気加硫する場合，繊維品のゴム防水加工に使用されるようなゴム配合剤，充てん剤およびこれらの分解物に対する染色堅ろう度試験方法について規定。繊維品の加硫における基本的なゴム配合剤に対するものであって，他の特殊な配合剤を組合せたものに対しては適用されない。
