abstract:
- language: ja
  script: Jpan
  content: 銅，銅合金及びアルミニウム合金の非鉄金属を用いて製造したボルト（植込みボルトを含む。）小ねじ，ナットなどのねじ部品で，適用条件（ねじの形式：ＪＩＳ　Ｂ　０２０５Ｂによるもの；ねじの呼び範囲：Ｍ１．６～Ｍ３９のもの；材料：銅，銅合金及びアルミニウム合金のもの）に該当するものの機械的性質とその試験，検査及び表示について規定。
