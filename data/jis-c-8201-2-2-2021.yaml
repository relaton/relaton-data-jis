abstract:
- language: ja
  script: Jpan
  content: 主接点を接続する回路の定格電圧が交流１　０００　Ｖ以下で，定格周波数が５０　Ｈｚ及び６０　　Ｈｚの漏電保護機能をもつ回路遮断器の安全性について規定。また，漏電電流を検出し，その測定値と設定値とを比較し，測定値が設定値を超えたとき，回路を遮断する装置に適用する。
