- language: ja
  script: Jpan
  content: ろ材を用いて水道水中の溶存物質，濁りなどを減少させる機能をもつ水処理器具のうち，主に家庭用に使用する浄水器について規定。ただし，ろ材として逆浸透膜（逆浸透膜モジュール）を使用した浄水器，及びサーバー形浄水器は除く。
