  content: 次の条件【a) 固定ピッチプロペラに直結した2サイクル，かつ，ロングストロークの低速ディーゼルエンジンを装備する場合。b) 甲板室の長さ（Ｌ）が，甲板室の高さ（Ｈ）と比較して短い［具体的には，細長比（H/L）が１．０以上である。］場合。】のいずれか又は両方に合致する船舶に乗る全ての人の居住性に関する振動計測，評価及び記録基準について規定。
