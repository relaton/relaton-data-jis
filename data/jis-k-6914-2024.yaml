abstract:
- language: ja
  script: Jpan
  content: この規格は，熱硬化性樹脂積層管について規定する。ここにいう積層管とは，紙又は布を主基材としてフェノール樹脂を結合剤とした円管，ガラス布を主基材としメラミン樹脂を結合剤とした円管及びガラス布を主基材としエポキシ樹脂を結合剤とした円管とする。
