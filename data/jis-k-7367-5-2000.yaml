  content: 熱可塑性ポリエステル（ＴＰｓ）を規定の溶媒で希釈して得た溶液の粘度数を測定する方法を規定。方法は，ポリエチレンテレフタレート（ＰＥＴ），ポリブチレンテレフタレート（ＰＢＴ），ポリシクロヘキシレンジメチレンテレフタレート（ＰＣＴ），ポリエチレンナフタレート（ＰＥＮ），及び共重合ポリエステル並びに他のポリエステルなどＩＳＯ　７７９２－１に規定され，規定溶媒のどれかに規定条件下で溶解するものに適用。
