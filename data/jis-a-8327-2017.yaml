  content: ＪＩＳ　Ａ　８３０８に定義する土工機械で，現場で工事を行い，また公道を走行するものに装着する警報ブザー類及び警音器の音響性能並びに警報音発生要件を判定するための静的（定置）試験方法について規定。警報音発生装置の機能又は耐久性の台上試験には適用しない。
