  script: Jpan
  content: 航空機の油圧系統に使用される構成部品（配管，ホース及び継手を除く）の現場における組立て又は試験作業中に，その構成部品に適正な作動油を容易に判断できるようにするための表示方式について規定。この表示は，構成部品を航空機に取り付ける際の便を，意図したものではない。
