abstract:
- language: ja
  script: Jpan
  content: |-
    この規格は，人を認識するバイオメトリクスの分野に関連する概念の体系的記述を確立する。また，この規格は，バイオメトリクスに関する既存の国際規格で使用する変形語を，優先用語と照らし合わせて調整することで，この分野における用語の使用を明確にする。
    この規格は，情報技術，パターン認識，生物学，数学などからの概念（用語で表現する）を網羅していない。バイオメトリクスでは，このような分野の知識を基礎として使用する。
