- language: ja
  script: Jpan
  content: 主接点が接続する回路の定格電圧が，交流１０００Ｖ以下又は直流１５００Ｖ以下の定格電圧である回路遮断器について規定。ヒューズ組込み回路遮断器に対する追加要求事項を含む。回路遮断器の適用，構造の形態及び定格電流にかかわらず適用。
