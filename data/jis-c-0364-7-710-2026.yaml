abstract:
- language: ja
  script: Jpan
  content: "この規格は，患者及び医療従事者の安全を提供するために，医用場所の電気設備に適用する。これらの要求事項を次の事項に適用する。\n－\t病院及び診療所又は同等の施設（同等の運搬可能及び移動可能な場所を含む）。\n同等の施設には，一般特性の評価に従って，次のものも含めることがある。なお，これらは，全てを網羅するものではない。\n－\t療養所及びヘルスクリニック\n－\t患者が医療を受ける，高齢者向け住宅及び老人ホーム内の専用の場所\n－\t医療センター，外来患者診療所及び医療部門，救急病棟\n－\tその他の外来患者施設（産業，スポーツなど）\n－\t医療及び歯科診療\n－\t職場内の専用医療室\n－\t医用電気機器を使用するその他の場所\n－\t動物病院\n－\t医療用途への適用のために用途の変更が生じる既存設備内の部屋"
