abstract:
- language: ja
  script: Jpan
  content: "この規格は，機械を設計，製造，据付け及び／又は供給する人（事業者）が導入することを意図した，次の放電加工機及び放電加工システムに適用可能な安全要求事項及び／又は保護方策について規定する。\n－\t手動形彫り放電加工機又は手動細穴放電加工機\n－\t数値制御形彫り放電加工機又は数値制御細穴放電加工機\n－\t数値制御ワイヤ放電加工機"
