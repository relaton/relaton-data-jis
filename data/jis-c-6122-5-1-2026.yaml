abstract:
- language: ja
  script: Jpan
  content: この規格は，光スペクトラムアナライザを用いた光増幅器の光反射率パラメータの測定方法について規定し，商用化されている光増幅器（OA）及び光増幅器サブシステムに適用する。ここでいうOAには，光ファイバ増幅器（OFA），半導体光増幅器（SOA）及び平面導波路形光増幅器（POWA）を含む。この中で，OFAには希土類添加OFA及びラマン効果を用いたOFAを含む。
