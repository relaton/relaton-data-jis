abstract:
- language: ja
  script: Jpan
  content: ＪＩＳ　Ｄ　０１０９：１９９０に定義する，２輪のモータサイクル及びスクータの操作装置，表示装置及び警報装置を表示し，その使用を容易にするために用いる識別記号，すなわち定型的な記号を規定。操作装置につながっている機器，装置の作動又は不具合を運転者に警告する表示灯及び警告灯の色についても規定。
