  script: Jpan
  content: 地上に設置する太陽光発電システムに用いる平面・非集光形の薄膜太陽電池モジュールの性能，構造及び試験方法について規定。アモルファスシリコン技術を主体として規定しているが，ほかの薄膜PVモジュールに適用可能である。ただし，有機太陽電池には，適用しない。
