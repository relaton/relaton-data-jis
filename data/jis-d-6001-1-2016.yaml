  content: ＪＩＳ　Ｄ　６２０１に定義された，カウンタバランスフォークリフト；リーチフォークリフト；ストラドルフォークリフト；パレットスタッキングトラック；プラットフォームスタッキングトラック；１　２００ｍｍまで運転者の位置が上昇するオーダピッキングトラック；サイドフォークリフト；ラテラルスタッキングトラック及び三方向スタッキングトラック；バイディレクショナルトラック及びマルチディレクショナルトラック；ラフテレインフォークリフト；バッテリ，ディーゼルエンジン，ガソリンエンジン又は液化石油ガス（ＬＰＧ）エンジンを動力源とするフォークリフト形式のフォークリフトトラックのための安全要求事項及び検証について規定。
