abstract:
- language: ja
  script: Jpan
  content: 低圧電気設備が，人，家畜及び財産に与える次の危険（電気機器に起因する熱の影響，材料の燃焼又は劣化，及びやけどの危険；電気設備からバリアによって隔離されている近傍の他の防火区画へ延焼する火災時の炎；安全設備を含む電気機器の安全機能の低下）からの保護対策について規定。
