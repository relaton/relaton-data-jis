  content: この規格は，タスクの強度，頻度及び作業時間を踏まえて，手作業による持ち上げ，持ち下げ及び運搬の推奨上限について規定する。この規格は，幾つかのタスク変数のアセスメントに関する要求及び推奨を提供するよう設計され，労働者集団の健康リスクの評価を可能にする。
