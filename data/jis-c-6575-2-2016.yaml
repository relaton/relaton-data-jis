abstract:
- language: ja
  script: Jpan
  content: 通常，屋内において用いる電気機器，電子機器及びそれらの部品を保護するための，寸法が直径１１ｍｍ×全長４０ｍｍ以下の管形ヒューズリンクについて規定。腐食しやすい場所又は爆発性の雰囲気が存在する特殊な状況にある場所での使用を目的とする機器に用いるヒューズには適用しない。
