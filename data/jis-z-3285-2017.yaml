abstract:
- language: ja
  script: Jpan
  content: 主として電子機器，通信機器などの配線の微細化による高密度プリント回路基板（例えば，最小導体幅及び最小導体間隙が，６０μｍ以下のもの。）への配線接続，部品の接続などに用いるＪＩＳ　Ｚ　３２８４－１に規定する粉末サイズの記号７及び記号８の微細粉末を使用したソルダぺーストの特性試験方法についての規定で，微細であるが故に表面活性力の影響を受けてしまうことに配慮し，ＪＩＳ　Ｚ　３２８４規格群よりも，精度良く試験するために規定。
