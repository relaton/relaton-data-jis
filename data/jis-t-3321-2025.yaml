abstract:
- language: ja
  script: Jpan
  content: この規格は，製造販売業者が特定した，診断又は治療用の処置針を体内へ導入するときの補助に用いる単回使用のせん（穿）刺針について規定する。ただし，誘導針自身が，薬液注入及び排液に用いるもの，直接処置するもの及び骨組織をせん（穿）刺するものは除く。
