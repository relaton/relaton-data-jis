abstract:
- language: ja
  script: Jpan
  content: この規格は，サービス付きオフィス及びそのサービスの機能について規定し，状態を示すアイコンを提供する。アイコンは，サービス付きオフィスの検索，予約，及び広告アプリケーションのユーザーインターフェースとして使用される。この規格は，全てのサービス付きオフィスの機能を定義する基本アイコン，並びにその他のサービスを示す追加及び多様なアイコンを規定する。
