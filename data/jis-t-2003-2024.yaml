abstract:
- language: ja
  script: Jpan
  content: 病院及び診療所以外で使用する家庭用電気治療器で，単相機器の場合は，定格電圧が１００　Ｖで作動し，内部電源機器の場合は，電源電圧が安全特別低電圧（ＳＥＬＶ）で作動する次の機器（－　家庭用超短波治療器；－　家庭用低周波治療器；－　家庭用電位治療器）について規定。
