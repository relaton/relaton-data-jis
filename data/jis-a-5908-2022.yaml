  script: Jpan
  content: 木材などの小片を主な原料として接着剤を用いて成形・熱圧した板について規定。パーティクルボードを基材として両面に単板を張った単板張りパーティクルボード，両面又は片面に化粧紙等を接着した化粧パーティクルボード，及び構造用パーティクルボードについても規定。
