  content: 力率改善，電圧調整などの目的で交流３３００Ｖ以上の回路に使用するＪＩＳ　Ｃ　４９０２に規定する高圧及び特別高圧進相コンデンサ又はそのコンデンサ群に直列に挿入して回路電圧波形のひずみを軽減させ，かつ，コンデンサ投入時の突入電流を抑制する目的に使用する直列リアクトルについて規定。
