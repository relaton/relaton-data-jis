abstract:
- language: ja
  script: Jpan
  content: この規格は，電気的検知帯法を用いて電解質溶液中に分散する粒子の粒子径分布を測定する方法について規定する。電気的検知帯法は，粒子の体積又は直径を電気的パルス信号から測定するもので，測定できる粒子径の範囲は一般的には約0.5
    μm～1 mm強である。電気的検知帯法は，特定の物質の測定に対して特別な取扱いを必要としない。
