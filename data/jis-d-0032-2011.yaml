abstract:
- language: ja
  script: Jpan
  content: 乗用車，小型・大型商用車及びバスの運転時に確実に認識でき，かつ，使用しやすいような操作装置，計量装置及び警報装置に用いる識別記号について規定。また，関係装置の作動又は不作動の状態を運転者に伝える視覚的警報装置の表示色を規定。
