- language: ja
  script: Jpan
  content: 電子プローブマイクロ分析（ＥＰＭＡ）を行う上で考慮しなければならない電子プローブ，波長分散X線分光器及び試料に関する測定パラメータの決定方法について規定。特に，プローブ電流，プローブ電流密度，不感時間，波長分解能，バックグラウンド，分析面積，分析深さ及び分析体積の決定のための手順についても規定。エネルギー分散Ｘ線分光器には適用しない。
