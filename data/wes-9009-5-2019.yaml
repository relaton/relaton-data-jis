abstract:
- language: ja
  script: Jpan
  content: |-
    この規格は，溶接，熱切断及び関連作業を行う際に発生する火災及び爆発を防止するための指針を示す。
    ただし，自動走行機構をもつ，自動溶接装置，自動熱切断装置及び溶接ロボットの装置の安全管理については，この規格の対象から除外する。
