  content: |-
    この規格は，PC工法溶接工事における被覆アーク溶接及び半自動アーク溶接を行う技能者の資格認証について規定する。
    この規格による資格の認証は，一般社団法人日本溶接協会と一般社団法人プレハブ建築協会がそれぞれ業務分担をして実施する。
