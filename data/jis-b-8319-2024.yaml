  content: 共通ベース上で，５０　Ｈｚ又は６０　Ｈｚの２極又は４極三相誘導電動機をたわみ軸継手によって直結し，０　℃～４０　℃の清水を取り扱う片吸込形で最高使用圧力２．７５　ＭＰａまでで使用するフランジの呼び径で表す吸込口径が４０　ｍｍ～２００　ｍｍで，羽根車の数で表す段数が２段～１５段のデフーザポンプ及び渦巻ポンプからなる一般用小形多段遠心ポンプについて規定。
