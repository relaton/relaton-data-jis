abstract:
- language: ja
  script: Jpan
  content: |-
    この規格は，可とう（撓）性材料で作られ，気道内の物質の吸引を使用目的とする閉鎖式吸引カテーテルを含む吸引カテーテルについて規定する。
    可燃性麻酔ガス若しくは薬剤，レーザー又は電気手術機器とともに使用する吸引カテーテルには，この規格を適用しない。
