abstract:
- language: ja
  script: Jpan
  content: 地上で溶接組立され，固定屋根，浮き屋根又は固定屋根付き浮き蓋をもち，底部を均質で，かつ，十分な支持力がある基礎で支持されている鋼製の全溶接製縦円筒形貯槽の構造について規定。貯槽本体及びこの規格に規定する附属品だけに適用し，ノズルに接続されるバルブ，配管，計器類などの附属品及び基礎，防油堤，塗装，断熱材などには適用しない。
