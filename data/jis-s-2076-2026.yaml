  content: この規格は，主に一般家庭における入浴，台所，洗面などに使用する温水の供給設備用に設計・製造した給湯機であって，電動圧縮式・空気熱源方式のヒートポンプ及び液化石油ガス又は都市ガスを燃料とする補助熱源機，貯湯タンク，給湯制御機器，リモコンなどで構成する家庭用の電気ヒートポンプ・ガス瞬間式併用型給湯機の給湯モードを用いた性能測定及び年間給湯効率算出方法について規定する。
