  content: 交流５０Ｈｚ又は６０Ｈｚの単相２線式１００Ｖ又は単相３線式１００／２００Ｖの電路において，主に住宅などの引込口装置として用いる住宅用分電盤で，定格電流が１５０Ａ以下のものについて規定。住宅のほかに店舗，事務所などにも適用。防水形，防爆形などの特殊構造のものには適用しない。
