abstract:
- language: ja
  script: Jpan
  content: この規格は，ユーザビリティ評価報告のための産業共通様式（CIF）について規定する。評価方法の分類，及び選択された評価方法に基づいて，評価報告書に含める内容項目（内容要素）の仕様を規定する。また，ユーザビリティ評価報告書の対象ユーザ，及びユーザビリティ評価報告書が適用可能な状況を特定する。
