  content: この規格は，選択された対象システムに関する主張のアシュアランスを，その主張を達成し，その達成を示すことによって行う際の手引及び推奨事項を提供する。手引及び推奨事項は，JIS
    X 0170（ISO/IEC/IEEE 15288）に基づくシステムアシュアランスプロセスビュー，及び，JIS X 0160（ISO/IEC/IEEE 12207）に基づくソフトウェアアシュアランスプロセスビューの規定の中に与えられる。
