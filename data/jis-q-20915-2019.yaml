abstract:
- language: ja
  script: Jpan
  content: "鉄鋼製品の特徴である閉ループリサイクルを反映した鉄鋼製品のＬＣＩ計算を行うため，次に示す項目［ａ）\t鉄鋼製品のＬＣＩ計算に用いられる機能単位（ｆｕｎｃｔｉｏｎａｌ　ｕｎｉｔ）の仕様；ｂ）\t鉄鋼製品のＬＣＩ計算に用いられるシステム境界（ｓｙｓｔｅｍ　ｂｏｕｎｄａｒｙ）の定義；ｃ）\t鉄鋼製品のＬＣＩ計算における鉄鋼スクラップの評価；ｄ）\t鉄鋼製品のＬＣＩ計算における共製品（ｃｏ－ｐｒｏｄｕｃｔ）の評価；ｅ）\t鉄鋼製品のＬＣＩ計算結果の報告］に対する要求事項及び指針について規定。"
