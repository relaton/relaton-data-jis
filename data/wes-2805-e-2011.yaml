abstract:
- language: ja
  script: Jpan
  content: "This standard applies to general welded steel structures, specifying the method for assessing the brittle fracture from cracks or similar planar flaws and for assessing the damage or brittle fracture caused by the fatigue crack growth from various types of flaws in fusion welded joints. \nWhen assuming that the final form of damage is brittle fracture, only the flaws existing in the stress concentration areas of structural elements, i.e. those surrounded by elastic stress fields, are assessed. When through-thickness flaws exist in planar joints, this standard only applies to the cases of fatigue crack growth. A pure application of fracture mechanics is sufficient to assess such relatively simple cases."
