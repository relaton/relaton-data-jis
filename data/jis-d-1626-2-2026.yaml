abstract:
- language: ja
  script: Jpan
  content: |-
    この規格は，電気・電子システム及びコンポーネントが，自動車内部又は外部へ取り付けられたときに影響を与える電気負荷を記載し，対応する試験手順及び要求事項について規定する。
    この規格は，モーターサイクル及びモペットのシステム並びにコンポーネントに対する環境要求事項又は試験に適用はしない。この規格に電磁両立性は含まない。
