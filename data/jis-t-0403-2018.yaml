  content: 左心補助人工心臓用脱血管の血栓形成性を，インビトロ（ｉｎ　ｖｉｔｒｏ）で評価する試験方法について規定。使用環境を模擬した血液循環回路を用いて，血液との接触初期の左心補助人工心臓用脱血管への血栓の付着と剥離とを評価するための試験方法を規定。
