  content: サブマージアーク溶接材料，ガスシールドアーク溶接用フラックス入りワイヤ及びセルフシールド溶接用フラックス入りワイヤを用いた鋼の，１ラン施工（ｏｎｅ－ｒｕｎ　ｔｅｃｈｎｉｑｕｅ）及び２ラン施工（ｔｗｏ－ｒｕｎ　ｔｅｃｈｎｉｑｕｅ）による溶接継手からの試験片の作製方法について規定。エレクトロスラグ溶接材料及びエレクトロガスアーク溶接材料を用いた溶接継手には適用しない。
