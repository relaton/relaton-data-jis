abstract:
- language: ja
  script: Jpan
  content: |-
    この規格は，製品又はシステムが明示された利用状況で利用される場合に利害関係者に影響を与える可能性のある，三つの特性（更に副特性に細分化される）から構成される利用時品質モデルについて規定する。このモデルは，利用時のコンピュータシステム及び利用時のソフトウェア製品の両方を含む，情報システム及びITサービスシステムの全領域に適用可能である。
    この規格は，利用時品質を仕様化，測定，評価及び改善するための一組の品質特性を提供する。
