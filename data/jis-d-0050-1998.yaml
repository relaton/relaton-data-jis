- language: ja
  script: Jpan
  content: 乗用車の可搬質量の分布を定義し，乗員の平均質量及び手荷物の質量について規定。定義された質量の総計をもとに，車両の公称設計負荷量（ｎｏｍｉｎａｌ　ｄｅｓｉｇｎ　ｐａｙ　ｍａｓｓ）を定義。ＪＩＳ　Ｄ　０１０１：１９９３に定義される「乗用車」に適用。
