abstract:
- language: ja
  script: Jpan
  content: この規格は，主として，熱間圧延，熱間鍛造及び熱間押出によって製造する機械構造用合金鋼鋼材について規定する。この規格は，同一断面形状の鋼材に適用し，通常，更に鍛造，切削などの加工及び熱処理を施して使用される。ただし，鋼管にはこの規格を適用しない。
