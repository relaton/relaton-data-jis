abstract:
- language: ja
  script: Jpan
  content: この規格は，手袋を含む防護服用に設計された材料及びその組立部品に適用するTDM型切創抵抗性試験方法並びに当該試験方法の計算方法について規定する。この試験は，ナイフ，金属薄板部品，金属切りくず，ガラス，刃のある工具，鋳造物などの鋭利物による切断に対する抵抗性の測定を目的としている。
