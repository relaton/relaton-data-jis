  content: 試験片の調製及びふっ素ポリマー熱可塑性プラスチックの試験方法について規定。試験結果は，分類，材料仕様，又はその両方の基本に使用する。ディスパージョン，又は型成形，押出成形，その他用途に使用する粉末状のふっ素ポリマーのホモポリマー及び各種のコポリマーの表示特性及びその他特性を測定する試験条件について規定。
