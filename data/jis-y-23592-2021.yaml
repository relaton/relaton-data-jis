abstract:
- language: ja
  script: Jpan
  content: 卓越した顧客体験及び持続可能なカスタマーデライトを実現するためのサービスエクセレンスの用語，原則及びモデルについて規定。基本的な顧客サービスの提供ではなく，エクセレントサービスの提供に焦点を当てている。営利組織，公共サービス及び非営利団体といった，サービスを提供する全ての組織に適用することが可能である。
