  script: Jpan
  content: 難治性角膜上皮疾患の治療を目的に，温度応答性培養皿を用いて自己の細胞から製造した，培養角膜上皮細胞シート及び培養口腔粘膜上皮細胞シートを，位相差顕微鏡などを用いて測定する方法などを取りまとめたものである。角膜上皮疾患の再生医療に活用できる。
