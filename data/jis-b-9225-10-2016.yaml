abstract:
- language: ja
  script: Jpan
  content: 農業用トラクタと，直装，半直装，けん（牽）引，又は自走作業機とのシリアルデータネットワークの制御及び通信について規定。タスクコントローラと電子制御ユニットとの間の通信に，必要なサービス及び要求を定義するタスクコントローラアプリケーション層について規定。ほ（圃）場管理コンピュータと通信するためのデータの書式，制御のために必要な計算方法，及び制御ファンクションに送信するためのメッセージの書式についても規定。
