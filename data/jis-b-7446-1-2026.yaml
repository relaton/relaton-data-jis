abstract:
- language: ja
  script: Jpan
  content: |-
    この規格は，校正された基準器を参照する置換測定法を用いた非接触座標測定システムの性能が，製造業者の指定する仕様に適合するかどうかを検証するための受入検査について規定する。
    この規格は，産業用ロボットに光学式距離センサを取り付けた非接触座標測定システムに，置換測定法を用いる場合に適用する。
