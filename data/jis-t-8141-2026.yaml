abstract:
- language: ja
  script: Jpan
  content: この規格は，目に対して有害な紫外放射，赤外放射及び強烈な可視光，並びに飛散する粒子及び破片が存在する場所において，職業上の危険に対する作業者の目を保護するため，着用する遮光保護具，並びに交換用のレンズ及びプレートの材料，設計及び性能について規定する。ただし，溶接用保護面の面体には適用しない。
