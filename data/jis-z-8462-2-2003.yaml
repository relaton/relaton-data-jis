abstract:
- language: ja
  script: Jpan
  content: 正味状態変数の限界値，応答変数の限界値及び検出可能な最小正味状態変数値を推定するための実験を計画する；校正関数（検量線）が直線であり，応答変数の標準偏差が一定の場合又は正味状態変数と直線関係にある場合に，実験データから正味状態変数の限界値，応答変数の限界値，及び検出可能な最小正味状態変数値を規定。
