  script: Jpan
  content: 厚さ６ｍｍ以上のフェライト系鋼の安全溶込み溶接部の，一探蝕子法又は二探蝕子法のパルス反射法による超音波斜角探傷試験において試験を自動で行う場合の装置，探傷方法及び探傷画像の表示方法について規定。鋼管の製造工程中の継手溶接部及び原子力プラントの溶接部には適用しない。
