- language: ja
  script: Jpan
  content: 点火装置が備わっており制御されたレベルの放射照度で水平な設置面を暴露する試験体の発熱速度及び煙生成速度を評価する方法について規定。発熱速度は，燃焼生成物の流量及び酸素濃度から得られる酸素消費量を測定することによって求める。
