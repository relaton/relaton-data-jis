abstract:
- language: ja
  script: Jpan
  content: 電気光源（例　白熱電球，蛍光ランプ，その他の放電ランプ，ＬＥＤ光源などの電子発光体）を用いる照明器具であって，電源電圧が1　０００　Ｖ以下で使用するものに適用する。照明器具の分類，表示，機械的構造，電気的構造及び光生物学的安全性に関する要求事項及び関連する試験について規定。
