  content: 鉄道車両用電気コネクタのための性能要件として，ＩＥＣ６１９８４：２００８の要求事項を満たした上で，追加の用語，単極当たり定格電圧１０００Ｖまで及び定格電流１２５Ａまでで，周波数３ＭＨｚ以下で鉄道車両の車内及び車外で使われる単極コネクタ及び多極コネクタに対する性能要求事項及び試験方法について規定。
