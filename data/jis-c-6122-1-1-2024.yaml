  content: この規格は，商用化されている光増幅器（OA）及び光増幅器モジュールの測定方法について適用する。ここでいうOAには，希土類添加ファイバ又はラマン効果を用いた光ファイバ増幅器（OFA），半導体光増幅器（SOA）及び平面導波路形光増幅器（POWA）を含む。
