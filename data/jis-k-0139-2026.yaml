abstract:
- language: ja
  script: Jpan
  content: この規格は，元素の定性分析，定量分析及び同位体比測定に用いる，レーザーアブレーションと誘導結合プラズマスぺクトロメトリー（誘導結合プラズマ質量分析法又は誘導結合プラズマ発光分光分析法）とを組み合わせた分析システム（LA-ICP-MS又はLA-ICP-OES）に関する一般的事項について規定する。この規格は，バルク分析及び局所分析（点分析，線分析，二次元イメージング分析，深さプロファイル及び三次元イメージング分析）に適用する。
