abstract:
- language: ja
  script: Jpan
  content: この規格は，自動車ガソリン及び航空燃料油（航空タービン燃料油及び航空ガソリン）の実在ガムを測定する方法について規定する。その他の揮発性留出油の実在ガムも測定可能であるが，精度は規定しない。また，自動車ガソリンの未洗実在ガムを測定する手順についても規定する。
