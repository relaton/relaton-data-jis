- language: ja
  script: Jpan
  content: 数多くの異なった形式の音響符号化，すなわち，合成音及び自然音，高品質配送及び低ビットレート配送，音声及び音楽，複雑なサウンドトラック音楽及び簡単なサウンドトラック音楽，並びに伝統的な素材及び対話的な仮想素材を統合する新しい種類の音響に関する規格とする。
