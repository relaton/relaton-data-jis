abstract:
- language: ja
  script: Jpan
  content: 画面からの反射の原因となる照明環境で使用するＶＤＴに対し，画質の要求事項について規定。性能又は設計の仕様の形で規定し，試験方法についても指定する。オフィス作業用の直視型電子式ディスプレイの人間工学上の設計に適用。オフィス作業には，データ入力，文書処理，対話形問合せなどを含む。オフィス作業は，直射日光が当たらない室内で行う。
