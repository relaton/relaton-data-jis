  content: 口内方撮影用Ｘ線受像器及び口外法撮影用Ｘ銭受像器を用いるＸ線装置（例えば，歯科用パノラマＸ線装置又は頭部規格撮影用Ｘ銭装置）に関する受入試験について規定。画質及び患者線量に影響を与える撮影画像システムに用いる歯科用Ｘ線装置の構成品に適用。
