  script: Jpan
  content: 鋼材及び鋼材加工品に，防食の目的で施す，溶融亜鉛アルミニウム合金めっきの有効面について規定。ＪＩＳ　Ｇ　３３１７及びＪＩＳ　Ｇ　３３２３に規定する溶融亜鉛アルミニウム合金めっき鋼板及び鋼帯，並びに連続的にめっきした溶融亜鉛アルミニウム合金めっき鉄線及び鋼線には適用しない。
