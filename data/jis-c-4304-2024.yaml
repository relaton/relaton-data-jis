abstract:
- language: ja
  script: Jpan
  content: |-
    この規格は，一般の受配電の目的に用いる特定エネルギー消費機器に対応した，配電用6kV油入変圧器について規定する。
    なお，変圧器の容量範囲は，単相10kVA以上500kVA以下，及び三相20kVA以上2000kVA以下とし，定格周波数は，50Hz又は60Hzとする。
