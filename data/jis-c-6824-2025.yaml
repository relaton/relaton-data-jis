abstract:
- language: ja
  script: Jpan
  content: "この規格は，石英系マルチモード光ファイバ，多成分系マルチモード光ファイバ，プラスチッククラッドマルチモード光ファイバ及び全プラスチックマルチモード光ファイバの単位長さ当たりの帯域の試験方法について規定する。試験方法については，次の三つの試験方法を規定している（箇条4参照）。\n・\t方法A：パルス法\n・\t方法B：周波数掃引法\n・\t方法C：モード遅延時間差（DMD）から全モード励振理論帯域（OMBc）を求める方法"
