abstract:
- language: ja
  script: Jpan
  content: ＪＩＳ　Ｒ　６２４１の表１（研削といしの普通使用周速度の限度）に規定する，普通速度で使用する外径１５０ｍｍ以上及び質量０．２ｋｇ以上並びに高速度で使用する外径１００ｍｍ以上及び質量０．１ｋｇ以上で，かつ，最高使用周速度が１０ｍ／ｓを超えて使用する研削といしの，平衡度の求め方及び実用的な研削といしの合否判定試験による検査方法について規定。また，研削といしの平衡度の最大許容値についても規定。
