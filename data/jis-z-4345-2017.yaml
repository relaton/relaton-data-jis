abstract:
- language: ja
  script: Jpan
  content: 個人線量当量，周辺線量当量及び方向性線量当量について，０．０１ｍＳｖ～１０Ｓｖの線量範囲内で，表１（最小定格エネルギー範囲及び試験エネルギー範囲）に示すエネルギー範囲のＸ・γ線及び／又はβ線の，次の測定［個人線量当量Ｈｐ（１０）（体幹部の線量計測）；個人線量当量Ｈｐ（３）（眼の水晶体の線量計測）；個人線量当量Ｈｐ（０．０７）（体幹部又は末端部の線量計測）；周辺線量当量Ｈ＊（１０）（環境の線量計測）；方向性線量当量Ｈ’（０．０７）（環境の線量計測）］に用いる受動形個人線量計測装置及び環境線量計測装置について規定。
