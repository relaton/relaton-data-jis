  content: ＪＩＳ　Ｃ　７５５１－１の要求条件に適合し，かつ，条件（定格消費電力　５Ｗ及び７Ｗ；定格電圧　１００Ｖ；ガラス球形状　Ｃ形，Ｇ形及びＴ形；ガラス球処理　無色透明及び白色仕上げ；口金　Ｅ１２／１５及びＥ２６／２５）を満たす家庭用小形白熱電球について規定。電球形ＬＥＤランプには適用しない。
