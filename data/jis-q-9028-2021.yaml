abstract:
- language: ja
  script: Jpan
  content: 品質管理の主要な活動の一つである小集団改善活動の実践に関して，小集団改善活動の基本的な考え方，及び小集団改善活動を組織的に推進する場合の指針を示す。組織の規模にかかわらず適用可能である。また，製造だけでなく，開発，営業，アフターサービス，管理間接などのあらゆる種類の職場に適用可能である。さらに，製造業だけでなく，サービス業を含めた様々な業種に適用可能である。
