  content: 標的の放射輝度を測定し，温度に換算して表示する工業用放射温度計のうち，狭帯域放射温度計（単色放射温度計）及び広帯域放射温度計（部分放射温度計）に関する仕様書及び／又は取扱説明書に記載する用語及び数値の表し方並びに仕様書に表す性能（特性）を再現するための試験方法について規定。
