- language: ja
  script: Jpan
  content: 建築物の床衝撃音の防止及び建築設備等の機械振動の防止を目的として浮き床構造［く（躯）体構造床及び壁と浮き床との間に，音響的架橋を生じないように緩衝材を挟むことによって，防振する構造をいう。］に使用する浮き床用グラスウール緩衝材について規定。
