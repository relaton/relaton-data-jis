abstract:
- language: ja
  script: Jpan
  content: この規格は，定格電圧が単相交流277 V以下，又は二相交流若しくは三相交流480 V以下の周波数が50 Hz又は60 Hzで定格電流が50 A以下の電源用ダクトシステム（PT）システムに関する一般要求事項及び試験について規定する。この電源用ダクトシステムは，家庭用，商業用及び工業用施設に配電するために用いられる。
