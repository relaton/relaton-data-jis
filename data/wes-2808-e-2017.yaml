abstract:
- language: ja
  script: Jpan
  content: "This standard specifies the method for assessing brittle fracture in steel weldments subjected to large cyclic and dynamic strain caused by earthquake using CTOD as a fracture mechanics parameter. \nThe first edition published in 2003 covered 400 to 590 N/mm2 class steel weldments. This revision expanded the application range up to 780 N/mm2  class steel weldments and improved the accuracy of assessment based on the recent development of fracture mechanics."
