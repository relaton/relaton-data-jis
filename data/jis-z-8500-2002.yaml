  script: Jpan
  content: 集団を比較するための基礎として使うことができる人体寸法項目について規定。基本測定項目は，集団を定義したり，人々が働き，生活する場の幾何学的な設計にその知識を利用する必要のある，人間工学の専門家のための指針として役立つことを意図して定める。
