abstract:
- language: ja
  script: Jpan
  content: |-
    この規格は，JIS C 5201-1を品目別通則とする電子機器用表面実装用固定抵抗器について規定する。
    この規格は，通常，品種（異なる形状），形式（異なる寸法）及び製品技術によって記載している。この規格に示す抵抗器は，外部との電気的接続を得るための金属電極をもち，主としてプリント回路板に直接取り付けて用いる。
