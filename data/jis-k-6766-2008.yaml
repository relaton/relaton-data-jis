abstract:
- language: ja
  script: Jpan
  content: 海水，腐食性のある流体，土壌，浸透液，排水などに長期間触れている部分の防食を主な目的として，海洋構造物，化学装置の機器・配管類，橋りょう（梁）及び大形槽，導水路などの土木構造物・設備において，金属面及びコンクリート面の上に被覆された樹脂ライニングの完成皮膜の湿式（電気抵抗式）及び乾式（放電式）によるピンホール試験方法について規定。
