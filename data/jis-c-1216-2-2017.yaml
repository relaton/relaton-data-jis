- language: ja
  script: Jpan
  content: 日本国内で取引又は証明における計量に使用される有効電力量計であって，次に示す計器（単相２線式回路，単相３線式回路，三相３線式回路及び三相４線式回路において，計器用変成器と組み合わせて使用する誘導形の普通電力量計，精密電力量計及び特別精密電力量計；電子式の直流電力量計）について規定。
