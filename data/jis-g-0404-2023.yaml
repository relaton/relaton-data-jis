abstract:
- language: ja
  script: Jpan
  content: ＪＩＳ　Ｇ　０２０３に定義されている鋼材の一般受渡し条件について規定。ただし，鍛鋼品・鋳鋼品及び粉末冶金製品を除く。注文時に合意した受渡し条件又は製品規格に規定された受渡し条件がこの規格の規定と異なる場合は，通常，注文時に合意した受渡し条件又は製品規格に規定された受渡し条件を適用する。
