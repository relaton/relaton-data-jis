  content: 技術製品がもつ，形状を定義しないエッジに対する寸法指示の規則及び寸法を規定。そのために使用する図示記号の形状及び寸法も規定。ただし，直方体の各頂点及び角すい体の頂点のように，三つ以上の平面が交わって形成される部分（コーナ）には適用しない。
