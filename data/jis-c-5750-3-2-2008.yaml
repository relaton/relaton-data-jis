- language: ja
  script: Jpan
  content: フィールドで動作しているアイテムの信頼性，保全性，アベイラビリティ及び保全支援能力に関するデータ収集のための指針について規定。データの収集及び表記に関する実用的な視点における一般事項について規定しており，データ解析及び結果の表記に関連する事項についても規定。；保全支援の方策を提供するものではない。
