abstract:
- language: ja
  script: Jpan
  content: この規格は，単独居住者用住宅の汎用配線設備について規定する。住宅は，一つ以上の建物を含むことも又は複数の住宅を含む建物内にあることも適用可能である。この規格は，平衡配線設備，光ファイバ配線設備及び同軸配線設備を含む。
