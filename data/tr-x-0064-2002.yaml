  content: ＸＭＬスキーマ言語のこの部分は，ＸＭＬスキーマの中で使用できるデータ型を示す。これらのデータ型は，＃ＰＣＤＡＴＡとして指定される要素内容，及びＤＴＤの中の多様な型の属性値に関して規定され得る。この規定が，〔ＸＳＬ〕〔ＲＤＦ　Ｓｃｈｅｍａ〕などの広範囲な他のＸＭＬ関連活動のために，ＸＭＬスキーマの文脈の外で利用できることを，この規定は意図している。
