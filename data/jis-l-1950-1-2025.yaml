  content: この規格は，薬剤処理の有無にかかわらず，防蚊性生地による蚊の接触の低減機能及び防蚊性生地を介した吸血の低減機能を評価する試験方法について規定する。この規格は，ヒト又は動物を吸血源とせず，これらの機能を評価するための試験方法を規定している。
