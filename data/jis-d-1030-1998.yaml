- language: ja
  script: Jpan
  content: 非分散形赤外線分析計，水素炎イオン化形分析計及び化学発光分析計を用い，ガソリン自動車，ディーゼル自動車及び液化石油ガス（ＬＰＧ）自動車，又はそれらに搭載されるエンジンから排出される，排気ガス中の一酸化炭素，二酸化炭素，全炭化水素及び窒素酸化物を，排気管から直接試料を採取して測定する直接測定法及び排気ガスを薄めて測定する希釈測定法について規定。
