abstract:
- language: ja
  script: Jpan
  content: 'This standard applies to two methods of ultrasonic fatigue testing-i.e.,
    axial loading by longitudinal oscillation and torsional loading by torsional oscillation-for
    metallic materials with a fatigue life of 10^7 or more at room temperature. Note:
    Ultrasonic fatigue testing is a technique to measure the fatigue life of materials
    by applying ultrasonic oscillations at a frequency to resonate the specimen for
    cyclic loadings.'
