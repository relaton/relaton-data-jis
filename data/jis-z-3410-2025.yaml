  content: |-
    この規格は，溶接管理活動のうち，溶接品質に関わる重要な任務及び責任について規定する。
    この規格に基づいて行われる溶接管理技術者の評価は，溶接管理技術者が割り当てられた任務を遂行する力量をもつ必要があるということを原則としている。
