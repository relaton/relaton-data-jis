- language: ja
  script: Jpan
  content: 安全弁，安全弁と破裂板式安全装置との組合せ，パイロット式安全弁，制御式安全圧力逃しシステムなどの圧力機器を保護する安全装置に関わる選定及び取付けについて規定。静圧の加わる機器を保護する安全装置の選定及び取付けに関する標準的事項についても規定。この配管は閉塞することなく，かつ，隔離できるバルブを含まない。
