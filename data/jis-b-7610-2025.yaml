- language: ja
  script: Jpan
  content: この規格は，単純型構造又は内包型構造のピストン・シリンダを装備し，直接荷重式で，測定範囲の上限が100 kPa～500 MPaのゲージ圧力及び絶対圧力の計測に対して用いる重錘形圧力天びんの性能を確保するために必要な計量・技術上の要求事項及び試験方法について規定する。
