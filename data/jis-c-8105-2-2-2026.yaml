abstract:
- language: ja
  script: Jpan
  content: この規格は，電気光源を用いる又は組み込むように設計された埋込み形照明器具であって，1000 V以下の電源電圧で使用するものの安全性要求事項について規定する。この規格を適用する照明器具には，通気ダクト又は通気に用いる天井内の空間（プレナム）と組み合わせて用いる埋込み形空調照明器具を含む。
