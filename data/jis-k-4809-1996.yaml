  content: ＪＩＳ　Ｋ　４８０１及びＪＩＳ　Ｋ　４８０５に規定されている火薬類の成分のうち，水；ニトログリセリン；ニトログリコール；ニトロセルロース；硝酸塩（硝酸アンモニウム，硝酸カリウム，硝酸ナトリウム）；過塩素酸塩（過塩素酸アンモニウム）；ニトロ化合物（トリニトロトルエンなど）；有機可燃物（木粉，でんぷん，木炭，重油，軽油，パラフィンワックスなど）；けい素鉄；アルミニウム；硫黄　の系統分析について規定。
