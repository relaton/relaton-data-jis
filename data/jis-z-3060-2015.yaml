- language: ja
  script: Jpan
  content: 厚さ６ｍｍ以上のフェライト系鋼の完全溶込み溶接部を，超音波パルスを用いた基本表示の超音波探傷器で，超音波探傷試験を手動で行う場合のきずの検出方法，位置及び寸法の測定方法について規定。鋼管の製造工程中の継手溶接部には適用しない。
