abstract:
- language: ja
  script: Jpan
  content: シミュレーション技術を用いて火災を予測するために，赤熱素子又は過不荷の抵抗器のような熱源によって短時間生じるおそれがある熱応力をシミュレートするために行うグローワイヤ試験について規定。電気製品・電子製品，サブアセンブリ及び部品，並びに固体電気絶縁物その他の可燃物に適用。
