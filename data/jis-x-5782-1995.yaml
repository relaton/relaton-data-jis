abstract:
- language: ja
  script: Jpan
  content: 試験管理機能を規定。試験管理機能は，ＪＩＳ　Ｘ　５００６で規定されたシステム管理を目的とした情報交換を行うために，集中的又は非集中的な管理環境の中の応用プロセスが使用する一つのシステム管理機能を規定。ＪＩＳ　Ｘ　５００３で規定された応用層に位置し，ＪＩＳ　Ｘ　５７２０で提供されるモデルに従って定義。システム管理機能の役割は，ＪＩＳ　Ｘ　５７６３による。
