  content: 広範な種類の電力ケーブル及び可とうコードの公称断面積が０．５ｍｍ＊２～２　５００ｍｍ＊２の素線構成及び導体の特性について規定。導体は固定配線用ケーブル用の銅線，アルミニウム線及びアルミニウム合金線の単線及びより線並びに可とう銅導体について規定。
