- language: ja
  script: Jpan
  content: 経口・経鼻・経皮又は経こう（肛）門的に下部消化管にカテーテル及びチューブを挿入し，減圧若しくは腸管内容物の体外への排出，狭さく（窄）部の拡張又は体内へ造影剤などを注入するために用いる下部消化管用カテーテル及びチューブについて規定。
