abstract:
- language: ja
  script: Jpan
  content: |-
    この規格は，製品規格，例えば，部品又は装置の規格を作成する際に，環境試験における湿度の影響について，必要な情報及び基本原則を提供する。さらに，恒温恒湿槽の操作に関する情報を提供する。
    この規格の目的は，一連の高温高湿試験に関する支援文書及び指針を提示することである。
