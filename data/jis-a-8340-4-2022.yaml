  script: Jpan
  content: ＪＩＳ　Ａ　８３０８に定義される油圧ショベルに対する安全要求事項について規定。２機種以上の土工機械に共通の一般要求事項を規定したＪＩＳ　Ａ　８３４０－１：２０２２と併せて用いることを意図している。この規格で規定した固有の要求事項は，ＪＩＳ　Ａ　８３４０－１：２０２２の一般要求事項に優先する。
