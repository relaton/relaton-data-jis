- language: ja
  script: Jpan
  content: この規格は，高齢者及び障害のある人々又は一時的な障害のある人々を含む可能な限り広範にわたる能力の人々のアクセシビリティを確保するために，あらゆる形態の電気通信機器，ソフトウェア及び関連電気通信サービスの標準化，企画，開発，設計及び流通に関する一般指針を提供することを目的としている。
