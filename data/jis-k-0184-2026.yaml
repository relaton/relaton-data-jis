abstract:
- language: ja
  script: Jpan
  content: この規格は，表面化学分析用に持ち込まれる試料の取扱い及び容器についての指針を示す。この規格は，表面分析サービスの利用者に対して，表面化学分析技術，特にオージェ電子分光法（AES），X線光電子分光法（XPS）及び二次イオン質量分析法（SIMS）の特別な試料片の取扱い要件を理解する助けとなることを目的とする。この手順は，表面組成に敏感なTXRFなどの他の分析手法にも適用してもよい。特別な場合，特別な試料では，さらなる注意事項が必要な場合がある。
