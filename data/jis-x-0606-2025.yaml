abstract:
- language: ja
  script: Jpan
  content: "この規格は，情報処理システムのユーザ間で情報を交換するためのコンパクトディスク読み出し専用メモリのボリューム構造及びファイル構造について規定する。\nこの規格は，次の事項を規定する。\n－\tボリュームの属性及びボリュームに記録するディスクリプタ（記述子）\n－\tボリュームセット（ボリューム集合）におけるボリューム間の関係\n－\tファイルの配置\n－\tファイルの属性\n－\tアプリケーションプログラムの入力又は出力データストリームをレコードセット（レコードの集合）として構成することが要求される場合に用いるレコード構造\n－\t媒体交換のための3段階のネストレベル（ネスト水準）\n－\t実装のための2段階のネストレベル\n－\t異なるシステム間でCD-ROMによる情報交換を可能にするために，情報処理システムが提供する処理に対する要求事項。そのためにこの規格では，規格に適合したCD-ROMを作成又は読み出しすることを目的としたシステムで提供される機能を規定する。"
