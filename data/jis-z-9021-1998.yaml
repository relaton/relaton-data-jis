  script: Jpan
  content: 工程の統計的管理の方法としてのシューハート管理図の使い方と理解のための指針を規定。シューハート管理図を用いた統計的工程管理法の取扱いに限られる。警戒限界線の使い方，傾向パターンの分析，工程能力といったシューハートのアプローチに関連する幾つかの追加情報も簡単に記す。
