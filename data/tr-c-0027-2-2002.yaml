  script: Jpan
  content: １００Ｖ以上の電圧敏感性をもつすべての電子デバイスの実動作期間中におけるＥＳＤ損傷から保護することを目的としたものである。保護は，製造から始まり製品の組立，製品の使用及び補修を経て製品の寿命の尽きるまでの期間を対象としている。
