  content: 定格荷重５００００ｋｇ以下のカウンタバランスフォークリフト；定格荷重５０００ｋｇ以下のリーチフォークリフト及びストラドルフォークリフト；定格荷重１００００ｋｇ以下のサイドフォークリフト；定格荷重５０００ｋｇオーダピッキングトラック；定格荷重５０００ｋｇ以下のパレットスタッキングトラック及びプラットフォームスタッキングトラック　の安定度及び安定度試験について規定。自由に動くような荷をつり下げて運ぶ装置（アタッチメント）を取り付けたフォークリフトには適用しない。
