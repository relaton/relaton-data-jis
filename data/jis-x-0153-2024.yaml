  content: この規格は，ソフトウェアの利用者用情報の設計者及び作成者のための作成プロセスを扱っている。この規格は，利用者が必要とする情報を確立する方法，その情報をどのように提示することが望ましいかを決定する方法，並びに情報の準備及び情報を利用可能にする方法を規定する。
