- language: ja
  script: Jpan
  content: ブルドン管と感温筒とを導管で連結したものの中に揮発性液体を封入し，感温部の温度変化による揮発性液体の蒸気圧変化を機械的な変位に変換し，温度として指針の動きに転換する単針で丸形ケーシングに同心の温度範囲－３０℃～＋２００℃に使用する蒸気圧式指示温度計について規定。
