abstract:
- language: ja
  script: Jpan
  content: この規格は，定格電圧が交流1　000 V以下（周波数1　000 Hz以下）又は直流1　500 V以下のバスダクト及びその附属品について規定する。ただし，トロリーバスダクトを除く。なお，ここでいう附属品とは，エンドクローザー，フィードインボックス及び分岐用接続器具をいう。
