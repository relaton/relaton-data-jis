  content: この規格は，供試品の封止の有効性を決定するための大リーク及び微小リークの封止外部及び内部検出に適用可能な封止試験について規定する。構成部品及び装置を良好な作動状態に維持するためのエンクロージャ，覆い及び封止の能力を確認するための更なる試験については，JIS
    C 60068-2-18が役立つことがある。
