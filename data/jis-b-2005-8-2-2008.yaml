- language: ja
  script: Jpan
  content: 調節弁を流れる液体による音圧レベルの測定方法，及びキャビテーションの発生による騒音の特徴的な増加の決定方法について規定。また，これらの特性を求めるために必要な実験室の空気中を伝ぱ（播）する音響を測定する装置，測定の方法及び手順についても規定。
