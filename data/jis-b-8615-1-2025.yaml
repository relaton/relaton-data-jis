abstract:
- language: ja
  script: Jpan
  content: "この規格は，住宅用，商業用及び工業用の一体形及び分離形エアコンディショナ及びヒートポンプで，次のものの能力及び効率の定格を決定するための，標準条件及び試験法について規定する。\n－\t工場で製作し，電気で駆動し，かつ，機械的な圧縮機構を使用したもの\n－\t一定能力形のもの，多段能力可変形のもの，及び連続能力可変形のもの\nこの規格は，次のものに適用する。\n－\t直吹き形空冷式エアコンディショナ及び直吹き形空気対空気ヒートポンプ\n－\t定格能力8
    kW未満，かつ，機外静圧が25 Pa未満で運転するように設計した，ダクト形エアコンディショナ及びダクト形ヒートポンプ\n－\t一つ以上の冷凍システム，一つの室外機及び一つ以上の室内機から構成し，一つのサーモスタット又はコントローラで制御する，エアコンディショナ又はヒートポンプ（全ての室内機を常に同時運転するマルチエアコン）"
