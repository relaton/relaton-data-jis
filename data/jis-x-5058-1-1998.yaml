- language: ja
  script: Jpan
  content: かぎ管理の目的；かぎ管理機構の基礎となる一般的なモデル；この規格の各部全体に共通なかぎ管理の基本概念；かぎ管理サービス；かぎ管理機構の特徴；ライフサイクル中のかぎ関連情報の管理の要件；ライフサイクル中のかぎ関連情報の管理の枠組み　以上を記述。枠組みは，特定のアンゴリズムのような，特定のアルゴリズムの使用から独立した，かぎ管理の一般的なモデルを定義。
