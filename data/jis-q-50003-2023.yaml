abstract:
- language: ja
  script: Jpan
  content: ＪＩＳ　Ｑ　５０００１のエネルギーマネジメントシステム（ＥｎＭＳ）の審査及び認証を行う機関に対する，ＥｎＭＳの審査及び認証の力量，一貫性及び公平性に関する要求事項について規定。また，ＥｎＭＳ審査の有効性を確実にするため，この規格は，審査プロセス，ＥｎＭＳの認証プロセスに関与する要員の力量の要求事項，審査工数，及び複数サイトサンプリングを規定。
