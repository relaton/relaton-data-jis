  content: 自律分散の概念に基づいた通信プロトコル（自律分散プロトコル）について，１）下位層がＴＣＰ，ＵＤＰ／ＩＰ，およびイーサネットであることを前提とした自律分散プロトコルについて規定。　２）プロトコルの機能を規定。　３）プロトコルデータ単位の符号化を規定。　４）この仕様に適合する実装のための機能要求条件を規定。
