abstract:
- language: ja
  script: Jpan
  content: 電気ケーブル又は光ファイバケーブル構成材料の燃焼時における発生ガスの潜在的腐食性を，燃焼中に発生するガスを通した水溶液の酸性度（ｐＨ値）及び導電率を測定することによって求める方法について規定。この規格の加熱（燃焼）手順は，ＩＥＣ　６０７５４－３と同じである。
