  content: タービン油酸化安定度試験器を用いて，鉱油に防せい剤及び／又は酸化防止剤を添加したタービン油並びに油圧作動油の酸化安定度を求める方法について規定。合成油又は合成油を含む試料もこの規格に規定する手順によって測定できるが，精度は適用しない。
