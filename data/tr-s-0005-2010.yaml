abstract:
- language: ja
  script: Jpan
  content: 矯正が難しい視力の低下，視野欠損，更に網膜疾患など，生理的に制限された視覚機能をもつロービジョンと呼ばれる人々に対し，一般の視覚表示物に用いる表面色についてＪＩＳ　Ｚ　８１０２に規定する無彩色を含む基本色の領域データを，明所視及び薄明視において，ＪＩＳ　Ｚ　８７２１に規定する三属性による色の表示方法に従って示したもの。
