abstract:
- language: ja
  script: Jpan
  content: "この規格は，パーソナルコンピュータ製品を対象としている。対象範囲は，市場において最終製品として販売されるデスクトップ及びノートブックパーソナルコンピュータである。特に，試験に使用する製品を被試験機器（EUT：equipment
    under test）という。\nこの規格では，次のことを規定する。\na)\tEUT\tの各消費電力モードにおける消費電力及び／又は消費電力量の測定を可能にする試験方法\nb)\t任意の期間（通常は年間）における標準消費電力量（以下，TECという。）を算出する計算式\nc)\tこの規格とともに使用する主要プロファイルの求め方。主要プロファイルは，平均消費電力を電力量へ変換するTEC計算式において用いる。\nd)\t結果を提示するための所定書式"
