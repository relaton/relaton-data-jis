abstract:
- language: ja
  script: Jpan
  content: 白又は三刺激値Ｙが２５を超える淡彩色塗料を，規定の隠ぺい率試験紙又は無色透明のポリエステルフィルムに，塗り面積２０ｍ×２／ｌで塗布し，次いで，ポリエステルフィルムの場合は，規定の白黒ガラス板上で，その塗膜の三刺激値Ｙを測定する塗膜の隠ぺい力（陰ぺい率測定による）測定方法について規定。
