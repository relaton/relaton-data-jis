abstract:
- language: ja
  script: Jpan
  content: インボリュート円筒歯車対の両歯面かみ合い偏差及び両歯面かみ合い中心距離を検査する両歯面かみ合い試験機の測定精度を，検査用基準器を用いて評価する方法について規定。また，両歯面かみ合い試験機の性能が，両歯面かみ合い試験機の仕様に適合するかどうかを，検査用基準器を用いて検証するための受入検査についても規定。
