abstract:
- language: ja
  script: Jpan
  content: 稼働中に手で運搬できない工作機械に用いる，電気・電子・プログラマブル電子の装置及びシステムについて規定。連携して稼働する一群の機械も適用範囲に含む。電気エネルギーを直接加工工具として使用する動力回路には，この標準仕様書を適用しない。
