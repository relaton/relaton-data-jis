abstract:
- language: ja
  script: Jpan
  content: 鋳鋼フランジ形弁：一般の機械装置，化学装置などに用いる鋳鋼フランジ形弁について規定。一般工業用鋼製弁：一般分野に用いる鋼製弁について規定。石油及び天然ガス工業用ボルテッドボンネット鋼製弁：石油精製及び関連する分野で要求されるエロージョン，コローション又は使用条件から，フルポートの口径寸法及び厚い肉厚を必要とするボルテッドボンネット鋼製弁について規定。
