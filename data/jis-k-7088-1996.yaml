abstract:
- language: ja
  script: Jpan
  content: 炭素繊維強化プラスチック（ＣＦＲＰ）の３点曲げ方式（Ａ法）及び４点曲げ方式（Ｂ法）による一般的なクリープ試験方法として一定の試験雰囲気下で，試験片に長時間の一定の曲げ荷重を加えて，試験片の曲げクリープたわみの測定及び／又は試験開始から試験片が破壊又はある規定された曲げクリープひずみに逹するまでの時間の測定を行う方法について規定。
