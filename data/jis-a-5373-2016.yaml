abstract:
- language: ja
  script: Jpan
  content: プレストレストコンクリート製のプレキャストコンクリート製品について規定。日本工業規格が別途定められている，建築用コンクリート製品及びその他のコンクリート製品には，この規格は適用しない。プレストレストコンクリート構造とすることを意図しない施工上の安全確保などを目的としてＰＣ鋼材などを用いている製品には，適用しない。
