  content: 主に建築物に使用するソーダ石灰ガラスの平板ガラス（型板ガラスを含む。）の曲げ強度である小面積同軸リング曲げ試験方法について規定。ただし，あな（孔）加工ガラス及び２枚以上のガラスで構成するガラス（合わせガラス，複層ガラス及び真空ガラス）には適用しない。
