abstract:
- language: ja
  script: Jpan
  content: 銅鉱，鉛鉱，亜鉛鉱，すず鉱，金鉱，銀鉱などの非鉄金属鉱石及び精鉱について，ロットの成分及び水分の平均値を決定するための方法を規定。ただし，他の日本工業規格で，（１）試料を採取する方法　（２）水分試験試料を調製する方法　（３）水分及び乾量を決定する方法　これらが規定されている鉱石には適用しない。　
