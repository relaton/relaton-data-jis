abstract:
- language: ja
  script: Jpan
  content: 繊維製品中に混用されている繊維の混用率を求める試験方法として，解じょ試験について規定。この試験方法は，繊維種類の異なる糸で組織し，編成し又は構成している繊維製品であって，糸にほぐすことによって繊維種類別に分類できるものの混用率の算定に適用。
