abstract:
- language: ja
  script: Jpan
  content: インターネット公式プロトコル規定ＳＴＤ　１１であるＲＦＣ　８２２では，ＵＳ－ＡＳＣＩＩメッセージヘッダについて多くの詳細を規定したメッセージ表現プロトコルを定義しているが，メッセージ内容，すなわちメッセージ本体については，構造のないＵＳ－ＡＳＣＩＩテキストだけとしている。このＴＲを含む一連のＴＲは，多目的インターネットネール拡張又はＭＩＭＥと総称され，メッセージのフォーマットを再定義する。
