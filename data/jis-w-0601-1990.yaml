- language: ja
  script: Jpan
  content: 航空機及び宇宙機の各種系統における剛性管組立の機能又は管内物質の適切な表示方法に対する要求事項について規定。ただし，航空エンジンの管組立について，管組立の切離し点で機体の系統と直接接続されるもの以外には適用しない。
