- language: ja
  script: Jpan
  content: 地理情報の時間特性を記述するための概念を規定。時間情報を交換するために規定した既存の情報技術規格を基礎とし，時間地物属性，地物操作及び地物関連の定義，並びに地理情報に関するメタデータの時間に関する情報の定義をするための基礎的な事項を規定。
