abstract:
- language: ja
  script: Jpan
  content: 歯車形の基準器を用いて歯車の歯形（インボリュート），歯すじ，ピッチ及び歯溝の振れの測定に使用する測定機の評価方法について規定。歯溝の振れについては，直接歯溝の振れを測定する機械に加えて，歯面の割出し誤差から歯溝の振れを計算する機械についても適用。測定機の測定不確かさを見積る方法も規定。
