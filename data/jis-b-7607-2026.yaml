  content: この規格は，個別の物体の質量又はばら状の物体の一塊の質量を計量する自動はかりのうち，自動重量選別機，質量ラベル貼付機及び計量値付け機であって，検査目量の数が100以上のものに対する性能要件及び試験方法について規定する。ただし，静的計量はかりは除く。
