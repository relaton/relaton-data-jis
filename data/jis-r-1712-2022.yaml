  content: 屋外構造物に用いる面状の光触媒材料（例えば，外壁材，テント，窓ガラス，水槽ガラス，フィルム，ガードレールなど）の紫外光照射下における防藻性試験方法について規定。ただし，粉体，粒状及び多孔質な光触媒材料には適用しない。
