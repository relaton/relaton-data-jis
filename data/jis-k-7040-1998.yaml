  content: 配管系に用いられるガラス強化プラスチック（ＧＲＰ）部材から切り出した試験片の，構成物質を測定する方法について規定。樹脂，ガラス，骨材及び充てん材の含有量の測定，並びにガラス層の種類及び配列の調査を含む。ガラス強化材の高温安定性に応じ，２通りの燃焼温度を規定。
