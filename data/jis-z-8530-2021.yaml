abstract:
- language: ja
  script: Jpan
  content: コンピュータを利用したインタラクティブシステムのライフサイクルを通して，人間中心設計の原則，及びそれに関連する活動のための要求事項及び推奨事項について規定。また，設計プロセスを管理する人が使うことを想定し，人間とシステムとのインタラクションの質を高める方法について取り扱う。
