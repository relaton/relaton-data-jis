abstract:
- language: ja
  script: Jpan
  content: この規格は，家庭用燃料電池発電システムのライフサイクルを考慮した環境影響の簡易的な評価方法について規定する。この規格は，貯湯ユニット（補助熱源機及び／又は貯湯タンクのような蓄熱システム）を含む燃料電池発電システムにも適用可能である。分析には，グリッドからの受電，又はグリッドへの送電を含めることが可能である。分析されるシステムは，特定の家庭の電力需要及び熱需要を満たすことを目的としている。
