abstract:
- language: ja
  script: Jpan
  content: この規格は，液体を充填したときに入味線が見えるソーダ石灰ガラス製のびんであって，液体をある一定の入味線高さまで充填したときに，容量が呼び容量と同じ値となる容量表示付きガラス製びんについて規定する。また，特殊容器に商品を入れる場合の入味線高さについても規定する。
