  content: 真空ポンプの排気速度，試験到達圧力，圧縮比及び臨界背圧の測定方法について規定。気体ため込み式真空ポンプには圧縮比及び臨界背圧の測定方法を適用しない。また，気体輸送式真空ポンプでも補助ポンプを必要としない真空ポンプには臨界背圧の測定方法は適用しない。
