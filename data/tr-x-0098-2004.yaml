  content: 対象とする音声認証システムとは，あらかじめ登録した音声の登録データと，ユーザが登録者であることを主張してあらたに入力する音声データを比較し，音声の個人性が一致したか否かを録音であることを主張してあらたに入力する音声データを比較し，音声の個人性が一致したか否かを判定するアルゴリズム，照合装置，又はシステムとする。
