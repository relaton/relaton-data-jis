abstract:
- language: ja
  script: Jpan
  content: この規格は，屋外気候での長期運転に適した全ての地上設置の平板形太陽電池（PV）モジュールの，特に結晶シリコンPVモジュールの設計適格性確認のための要求事項について規定する。設計適格性が確認されたPVモジュールの耐用年数は，PVモジュールの設計，使用環境及び運転される条件の影響を受ける。試験結果は，PVモジュール寿命の定量的予測とは解されない。
