abstract:
- language: ja
  script: Jpan
  content: 消費生活用製品のアクセシビリティ評価方法について規定。なお，この規格に基づく評価結果の想定利用者には，消費生活用製品を使用する消費者，及び消費生活用製品を仲介・購入する流通業者，宿泊施設・住宅・高齢者施設などの設計者又は運営者並びに公共調達の関係者を含む。
