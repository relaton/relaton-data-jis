  script: Jpan
  content: 被覆アーク溶接棒，ガスシールドアーク溶接用ソリッドワイヤ並びにガスシールドアーク溶接用及びセルフシールドアーク溶接用フラックス入りワイヤによるアーク溶接時の，ヒューム発生量測定方法及び分析用ヒューム採取方法について規定。ティグ溶接用溶加棒及びソリッドワイヤを用いるティグ溶接は，ヒューム発生量が少ないため対象としない。
