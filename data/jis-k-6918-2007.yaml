abstract:
- language: ja
  script: Jpan
  content: ジアリルフタレート樹脂成形材料について規定。成形材料とは，ジアリルフタレート（オルトタイプ及びイソタイプの両方を含む。）のプリポリマー及びモノマーに各種補強基材，充てん材，重合開始剤，滑剤，着色材などを配合して製造した粉状，粒状又はフレーク状のものである。
