abstract:
- language: ja
  script: Jpan
  content: この規格は，通信機器，電子機器及び類似の機器において50 GHz～110 GHzのミリ波電波を伝送するためのフレキシブル導波管の接続に用いるかん合構造の寸法，電気的特性及び機械的特性について規定する。なお，この規格の要求事項を満たす場合は，誘電体導波路，従来の中空金属導波管などのフレキシブル導波管以外の導波管にも適用可能である。
