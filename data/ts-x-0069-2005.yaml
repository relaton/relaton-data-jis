  script: Jpan
  content: 多目的インターネットメール拡張又はＭＩＭＥと総称され，ＵＳ－ＡＳＣＩ以外の文字集合でのテキストのメッセージ本体；非テキストのメッセージ本体のための異なるフォーマットの拡張集合；マルチパートのメッセージ本体；ＵＳ－ＡＳＣＩＩ以外の文字集合でのテキストのヘッダ情報を可能とするために，メッセージのフォーマットを再定義する。
