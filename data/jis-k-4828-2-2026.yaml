  content: この規格は，輸送中の火薬類が，内部要因による火災若しくは外部出火源からの火災，又は内部要因による爆発にあった場合の危険性を評価し，危険区分1.1，1.2，1.3若しくは1.4（隔離区分をSとするか又はS以外とするか）に分類されるか又はクラス1ではないと判定するための試験方法について規定する。
