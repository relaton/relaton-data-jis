  content: 鋼中の表１（けい素；マンガン；りん；ニッケル；クロム；モリブデン；銅；バナジウム；コバルト；チタン；アルミニウム；カルシウム；マグネシウム；ひ素）に規定する１４成分の含有率について，ＩＣＰ発光分光分析方法によって定量する方法のうち，酸分解・炭酸ナトリウム融解法について規定。各成分のうち1成分でも含有率が表１の定量範囲の上限値を超える鋼には適用しない。ひ素については，鉄含有率（質量分率）が９０％未満の鋼には適用しない。
