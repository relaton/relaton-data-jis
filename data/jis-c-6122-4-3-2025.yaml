abstract:
- language: ja
  script: Jpan
  content: この規格は，出力パワーを制御する光増幅器（OA）を含む光サブシステムに適用する。この規格は，JIS C 6121-1に示される，希土類のドーパントを含むアクティブ光ファイバを用いた，現在商用化されている光ファイバ増幅器（OFA）のほか，半導体光増幅器（SOA）のような単一チャネル出力光パワー制御で用いる代替光増幅器にも適用する。
