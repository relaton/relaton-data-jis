abstract:
- language: ja
  script: Jpan
  content: この規格は，セントラル空調システムに用いる空調用閉路水循環系用配管抵抗低減剤の抵抗低減性能及び防せい（錆）性能（腐食速度）の試験方法，並びに試験結果の報告書の記載事項について規定する。この規格において，抵抗低減性能は，一般的な冷房時の水循環温度から常温程度までの温度範囲を対象とする。また，防せい性能は，一般的な暖房時の水循環温度を対象とする。
