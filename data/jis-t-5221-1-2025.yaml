  content: この規格は，根管治療に用いる歯内療法器具（例えば，エンラージャ，コンパクタ，補助器具，形成器具及び清掃器具，並びに数字コード化システム）に対する一般的要求事項及び試験方法について規定する。また，この規格は，一般的な寸法の指定，カラー表示，包装及び識別記号についても規定する。
