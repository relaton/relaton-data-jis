abstract:
- language: ja
  script: Jpan
  content: この規格は，UV-C照射を必要とする，UV殺菌照射（UVGI）の又はその他の処理中の材料及び部品へのUV-C放射の暴露について，並びにそれらの環境を模擬するための試験手順について規定する。すなわち，UV-C照射の様々な頻度及び強度を表す厳しさについて規定し，また，この規格の試験条件は，多くの放射が254
    nmの単一スペクトル線である低圧水銀ランプを利用する装置に限定する。
