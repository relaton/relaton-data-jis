abstract:
- language: ja
  script: Jpan
  content: |-
    この規格は，JIS C 8147規格群を対象とする製品に使用されるプログラム可能な部品に対する一般要求事項及び安全要求事項を規定する。
    この規格の要求事項は，電気光源用電子制御装置内のプログラム可能な部品（組込みソフトウェアを含む。）だけに適用する。電気光源用電子制御装置内のその他の電気・電子回路及びその構成部品については，JIS C 8147規格群の要求事項を適用する。
