abstract:
- language: ja
  script: Jpan
  content: |-
    この規格は，構造用鋼材の疲労亀裂伝播性能について，室温，大気中における一般的な疲労亀裂伝播試験方法について規定する。
    本規格により，疲労亀裂伝播性能の評価結果に基づく，大型溶接構造物の設計・建造の普及に寄与することが期待される。
