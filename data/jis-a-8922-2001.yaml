  content: 保護ガードの負荷時の特性を評価するために，確実で再現性のある試験方法及び性能要求事項を定める。このようなガードは，通常，運転席の前や上から運転席に飛来する物体（例えば，岩石及び破片）に対して油圧ショベルの運転員を適切に保護することを目的。
