abstract:
- language: ja
  script: Jpan
  content: 航空機の動的挙動に影響を与える空気の動きのモデルを特徴づける概念及び量について取扱う。地球に対して相対的な空気の動きは，航空機の飛行経路上の各点における風の速度によって規定。飛行力学の諸問題においては，風の速度の場及び時間に伴うそれの変化の数学的モデルを使用するのが一般的である。
