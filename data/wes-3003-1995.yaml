abstract:
- language: ja
  script: Jpan
  content: この規格は，溶接構造物に用いられる降伏点又は耐力の保証値が685N/mm2以下の圧延鋼板で，板厚が6mm以上100mm以下，最低使用温度が0°C以下-196°C以上のものを対象とした鋼板の材質判定基準を規定し，一般社団法人日本溶接協会において低温用圧延鋼板の鋼種認定を受けた鋼種に適用する。
