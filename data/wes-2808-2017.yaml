abstract:
- language: ja
  script: Jpan
  content: |-
    この規格は，地震により動的繰返し大変形を受ける溶接鋼構造物のぜい性破壊に対する性能を，破壊力学パラメータとして亀裂先端開口変位（CTOD）を用いて評価する手法を規定する。
    2003 年に発行された初版では，400～590 N/mm2 級鋼溶接構造物を対象としていたが，この版では780 N/mm2 級鋼溶接構造物までに適用範囲を拡大している。
