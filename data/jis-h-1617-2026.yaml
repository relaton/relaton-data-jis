abstract:
- language: ja
  script: Jpan
  content: |-
    この規格は，酸素雰囲気下での高周波誘導加熱燃焼－赤外線吸収法によるチタン及びチタン合金の炭素定量方法について規定する。
    なお，この方法は，炭素含有率0.002 %（質量分率）～0.20 %（質量分率）の定量範囲に適用する。
