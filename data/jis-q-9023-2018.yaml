abstract:
- language: ja
  script: Jpan
  content: 品質管理の主要な活動の一つである方針管理に関する次の三つの指針［方針管理を実践する中核となる各部門の管理者を対象にした，各部門における方針管理の具体的な進め方の指針；トップマネジメント，及び組織全体の方針管理に責任をもつ人を対象にした，組織全体としての方針管理の進め方の指針；トップマネジメント，及び組織全体の方針管理に責任をもつ人を対象にした，方針管理を組織的に推進するための教育，ツール及び評価の指針］を示す。
