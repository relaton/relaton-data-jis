  content: 硬質プラスチック平板の平面曲げ疲れ試験方法について規定。平面曲げ疲れ試験とは，平板状試験片の面に直交し，かつ試験片の軸を通る面内で，曲げモーメントを繰返し与えることによりプラスチックの疲れ性質を測定する試験をいう。
