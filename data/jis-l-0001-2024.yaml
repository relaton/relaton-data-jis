abstract:
- language: ja
  script: Jpan
  content: この規格は，繊維製品の表示に使用すること，及び繊維製品の洗濯などの取扱処理において，製品に不可逆的な損傷を引き起こさない最も厳しい処理に関する情報を提供することを目的とし，家庭洗濯（洗濯，漂白，乾燥及びアイロン仕上げ）及び商業クリーニング（ドライクリーニング及びウエットクリーニング）による繊維製品のケア（取扱方法）に関する表示記号及び表示方法について規定する。ただし，工業ランドリーは除く。
