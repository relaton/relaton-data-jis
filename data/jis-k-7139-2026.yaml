abstract:
- language: ja
  script: Jpan
  content: この規格は，プラスチック材料を成形することによって作製する試験片，及びシート又は成形品から機械加工によって作製する試験片に要求される形状について規定する。この規格は，比較可能なデータの取得に使用する試験片及びその他のよく使用する試験片の呼び方と寸法とを集約する。
