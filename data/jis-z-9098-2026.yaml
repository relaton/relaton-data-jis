abstract:
- language: ja
  script: Jpan
  content: この規格は，津波，高潮，洪水，内水氾濫，土石流，崖崩れ・地滑り，大規模な火事，火山噴火及び地震による災害の発生に備え，人々が様々な種類の自然災害の危険性を明確に認識し，安全な場所へ適切に避難するための情報を提供する災害種別避難誘導標識システムについて規定する。ただし，この規格で扱う自然災害の原因となる台風又は雪崩などの特殊な危険性によるものを除く。
