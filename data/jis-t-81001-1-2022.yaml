abstract:
- language: ja
  script: Jpan
  content: ヘルスソフトウェア及びヘルスＩＴシステムについて，図１に示す構想から使用停止までの全ライフサイクルにわたる安全，有効性及びセキュリティの主要特性について，原則及び概念を示し，用語及び定義について規定しており，要求事項は含んでいない。この規格では，責任の移転が起こるライフサイクルのポイント及びその移行ポイントに必要な多角的なコミュニケーションの種類についても特定している。
