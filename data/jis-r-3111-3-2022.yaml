abstract:
- language: ja
  script: Jpan
  content: 主に建築物に使用する平板のソーダ石灰ガラスのエッジの影響を含む曲げ強度試験方法について規定。ただし，厚さの呼びが３ミリ～１９ミリの平板ガラスに適用し，あな（孔）加工ガラス及び２枚以上のガラスで構成するガラス（合わせガラス及び複層ガラス）には適用しない。
