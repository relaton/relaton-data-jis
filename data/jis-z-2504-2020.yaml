abstract:
- language: ja
  script: Jpan
  content: 漏斗を用いて金属粉の見掛密度を測定する方法について規定。この方法は，漏斗角60°で直径2.5 mmのオリフィスから自然に流れ出す金属粉に適用する。ただし，漏斗角60°で直径2.5
    mmのオリフィスから流れ出ない場合は，漏斗角30°で直径2.5 mmのオリフィス又は漏斗角60°で直径5.0 mmのオリフィスを用いてもよい。
