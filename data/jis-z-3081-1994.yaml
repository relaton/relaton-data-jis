- language: ja
  script: Jpan
  content: アルミニウム及びアルミニウム合金管の完全溶込み溶接部のパルス反射法による基本表示の探傷器を用いて行う管外面からの超音波斜角探傷試験方法について規定。外径が１００ｍｍ以上１５００ｍｍ以下で肉厚が５ｍｍ以上のアルミニウム管の長手継手溶接部のうち肉厚ｔと外径Ｄの比ｔ／Ｄが１６％未満のものに適用。
