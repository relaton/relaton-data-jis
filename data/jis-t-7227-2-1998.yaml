  content: プラスチック材料又はゴムで作られた内径６ｍｍよりも大きい気管切開チューブの基本的な要求事項を規定。チューブは，麻酔，人工呼吸，他の呼吸補助を必要とするような患者のために設計されたものであるが，これらの用途だけには限定されない。特殊なチューブには適用されない。
