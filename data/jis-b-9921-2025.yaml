abstract:
- language: ja
  script: Jpan
  content: この規格は，空気を吸引し，その中に含まれる浮遊粒子の個数濃度及び粒径分布を測定する光散乱式気中粒子計数器の校正方法及び試験方法について規定する。この規格における粒子計数器は，粒子を個々に測定する装置であり，一般的な測定粒径範囲は，0.1
    μm～10 μmである。
