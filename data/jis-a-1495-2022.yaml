abstract:
- language: ja
  script: Jpan
  content: 赤外線カメラを用いて高放射率の拡散面を評価する場合において，既存建築物の不透明な建築部位の熱抵抗，熱貫流率を測定するための赤外線法を規定。建築部位の断熱性能の欠損領域を特定するための定量的評価として赤外線カメラによる熱画像を用いた現場での測定方法（スクリーニング試験）を示す。
