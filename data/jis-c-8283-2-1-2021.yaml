abstract:
- language: ja
  script: Jpan
  content: 家庭ミシン用の特殊な機器用カプラで，定格電圧250 V以下，定格電流3.0 A以下の交流専用のミシン用カプラについて規定。ミシン用カプラは制御部品又はミシン動作用の回路によって2個以上の極（コンタクト又はピン）があってもよく，また，接地極（コンタクト又はピン）はあってもなくてもよい。
