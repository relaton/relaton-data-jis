  script: Jpan
  content: 高齢者及び障害のある人々が自力で住宅用のドア及び窓を容易に，かつ，安全に使用するため，ドア及び窓に要求される性能を規定し，建具金物を選定するときに留意すべき基本的事項について規定。自動ドア及び電動式ドアは除く。
