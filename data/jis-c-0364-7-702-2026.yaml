abstract:
- language: ja
  script: Jpan
  content: "この規格の要求事項は，次の場所の電気設備に対して適用する。\n－\t水泳プール及び子供用プールの水槽並びにそれらの周囲の区域\n－\t自然の湖水地域，人造湖及び海岸並びにそれに類する場所であって，特に水泳，水遊び及び類似の目的のために人が立ち入ることが予期される場所，並びにそれらの周囲の区域。自然の湖水地域，人造湖及び海岸並びにそれに類する場所のような地域は，水泳プールとみなす。\n－\t噴水池及びそれらの周りの区域"
