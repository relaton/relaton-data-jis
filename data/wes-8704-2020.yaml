  content: |-
    この規格は，WES 8703に基づいて実施する建築鉄骨溶接ロボットの型式認証基準について規定する。
    この規格は，一般社団法人日本ロボット工業会との共同規格であり，一般社団法人日本ロボット工業会はJARAS  1013を制定し，建築鉄骨溶接ロボットの型式を認証し，型式認証書の発行と型式の管理を行なっている。
