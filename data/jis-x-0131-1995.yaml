abstract:
- language: ja
  script: Jpan
  content: ここで定義する図表及び記号がソフトウェアの機能及び遷移を表現する上で役立つとともに，利用者間の意思の伝達を改善する上でも役立つという考え方に基づいている。適用領域は，ソフトウェアの要求分析及び設計における開発作業，意思の伝達，レビューなどである。次のソフトウェアの分野で役立つ。対話型のソフトウェア－画面上での機能及び遷移の表現の記述；データ通信ソフトウェア－通信プロトコル及び通信動作の記述
