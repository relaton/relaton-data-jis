abstract:
- language: ja
  script: Jpan
  content: この規格は，3.1に定義するパーソナルウォータークラフト（PWC）の構造及びシステム搭載時の要求事項について規定する。製造者銘板の製作及び設置，ウォータークラフト識別，恒久的に設置された燃料装置，電気装置，操だ（舵）装置，換気，船体構造及び浮揚，復原性，乾げん（舷），係留及びえい航，浸水，オフスロットル操だ並びにオーナ用マニュアルについて規定する。
