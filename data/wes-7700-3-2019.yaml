  content: 石油精製，石油化学，化学などのプラントの圧力設備は高経年化に伴い減肉，割れなどの劣化・損傷を受けやすい。供用中に検出された耐圧部材の局部的な欠陥の補修方法のうち，この規格は，欠陥が発生している部位を除去し，新たにインサートプレートを挿入して全周を完全溶込み突合せ溶接で取り付ける補修方法について規定する。
