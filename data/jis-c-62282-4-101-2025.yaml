abstract:
- language: ja
  script: Jpan
  content: "この規格は，定格出力が直流150 V以下の屋内及び屋外用途の，燃料容器を車両内又は燃料電池発電システム内に恒久的に固定し，燃料として気体水素又はメタノールを改質せずに使用する電気式産業車両用燃料電池発電システムの安全要件について規定する。\nこの規格は，JIS
    D 6201に規定する自走式産業車両（以下，産業車両という。）に用いる燃料電池発電システムに適用する。ただし，次の産業車両は除く。\n－\tラフテレイン フォークリフト\n－\tローリフト
    ストラドル キャリア\n－\tストラドル キャリア\n－\tラフテレイン バリアブルリーチ トラック\n－\tアーム回転機能付ラフテレイン バリアブルリーチ
    トラック\n－\tリーチスタッカ\n－\tショベルローダ"
