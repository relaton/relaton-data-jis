abstract:
- language: ja
  script: Jpan
  content: 家庭用及び業務用音響装置に用いるマイクロホンについて規定。マイクロホンはマイクロホンの出力端子に至るまでの変成器，増幅器，又はマイクロホンを構成する素子などの装置を含む。計測用マイクロホン及び電話機器用マイクロホンは除く。
