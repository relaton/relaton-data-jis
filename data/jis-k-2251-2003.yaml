  content: 原油，石油製品，半製品，タンク残留物及びたい積物の試料を固定タンク，タンク車，タンクローリ，ドラム，石油タンカー，バージ船などの船舶並びにパイプラインなどから採取する方法について規定。液化石油ガス，電気絶縁油及び芳香族製品は適用しない。
