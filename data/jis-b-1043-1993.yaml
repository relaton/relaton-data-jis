  content: 特殊要求のボルト，ねじ及び植込みボルトの各種表面欠陥に対する許容限界を規定。ねじの呼び径５ｍｍ以上，部品等級　Ａ及びＢ，呼び長さ　ｌ≦１０ｄ（特別な規定があれば１０ｄを超えてもよい），強度区分１２．９，強度区分８．８，９．８及び１０．９（ねじ部品規格に規定されている場合，又は受渡当事者間の協定がある場合）のボルト，ねじ及び植込みボルトに適用。
