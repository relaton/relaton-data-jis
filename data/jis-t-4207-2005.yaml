abstract:
- language: ja
  script: Jpan
  content: 人の体温検出を目的にこ（鼓）膜及びその周辺の温度検出に赤外線検出素子を用いた，実測温度測定機能付きで，実測温度又は人体部位の温度に変換してデジタル表示し，内部電源によって作動する耳用赤外線体温計について規定。システムの一部として他の機器に組み込んで使用するもの，又はこ膜及びその周辺以外の皮膚温度を測定するものを除く。
